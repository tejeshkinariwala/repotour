<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoTour</title>
<style>
:root{
  --bg:#f6f6f3; --surface:#ffffff; --surface2:#f0f0ec; --text:#1c2230; --muted:#59616f; --border:#dcdcd5;
  --accent:#2350c8; --accent-bg:#e8eefc; --warn:#8a5300; --warn-bg:#fff3d6; --warn-border:#e8c777;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 2px 8px rgba(20,25,40,.04);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#13161c; --surface:#1b1f27; --surface2:#242933; --text:#e6e9ef; --muted:#a3abb8; --border:#2f3541;
  --accent:#86aaff; --accent-bg:#232f4d; --warn:#f3c56b; --warn-bg:#3a2e14; --warn-border:#6b5320;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:.88em}
h1{font-size:2rem;line-height:1.2;margin:0 0 .4rem;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:2.4rem 0 .8rem;letter-spacing:-.005em}
h3{font-size:1.05rem;margin:0 0 .4rem}
p{margin:.6rem 0}
.prose{max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--surface);padding:6px 10px;z-index:100}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main a{color:var(--muted);padding:6px 10px;border-radius:6px;font-size:.94rem}
nav.main a:hover{background:var(--surface2);text-decoration:none;color:var(--text)}
nav.main a[aria-current=page]{color:var(--accent);background:var(--accent-bg);font-weight:600}
.spacer{flex:1}
.searchbox{position:relative;min-width:200px;flex:0 1 300px}
.searchbox input{width:100%;padding:7px 34px 7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:.92rem}
.searchbox kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:.75rem var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 5px;pointer-events:none}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-height:70vh;overflow:auto;z-index:30;min-width:340px}
.dropdown[hidden]{display:none}
.dd-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 12px 2px}
.dd-i{display:block;padding:6px 12px;color:var(--text);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-i:hover,.dd-i.sel{background:var(--accent-bg);text-decoration:none}
.dd-i .muted{margin-left:6px;font-size:.82rem}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:var(--surface2)}
.badge{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);border-radius:999px;font-size:.75rem;font-weight:700;padding:0 7px;line-height:1.4}

main{max-width:1120px;margin:0 auto;padding:28px 20px 60px;outline:none;min-height:70vh}
footer{max-width:1120px;margin:0 auto;padding:18px 20px 40px;color:var(--muted);font-size:.86rem;border-top:1px solid var(--border)}

.tagline{font-size:1.15rem;color:var(--muted);margin:0 0 1rem;max-width:60ch}
.crumbs{font-size:.88rem;color:var(--muted);margin-bottom:.8rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:1.1rem 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow)}
.stat b{font-size:1.25rem;display:block;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.banner{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:1rem 0;max-width:80ch}
.banner code{background:var(--surface);padding:1px 6px;border-radius:4px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.pcard{border-top:5px solid var(--pc,var(--accent));display:block;color:var(--text)}
a.pcard:hover{text-decoration:none;border-color:var(--pc,var(--accent));transform:translateY(-1px)}
.pcard h3{margin:0 0 2px;font-size:1.1rem}
.pcard .role{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.pcard .nums{font-size:.82rem;color:var(--muted)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--pc,var(--accent));margin-right:6px}
.map{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:var(--shadow);margin-bottom:14px}
.map svg{width:100%;height:auto;display:block;max-height:440px}
.map .node rect{fill:var(--pc);fill-opacity:.16;stroke:var(--pc);stroke-width:2}
.map .node:hover rect{fill-opacity:.3}
.map .node text{fill:var(--text);font:600 14px var(--sans)}
.map .node text.sub{font:12px var(--sans);fill:var(--muted)}
.map .edge{fill:none;stroke:var(--muted);opacity:.75}
.map .elabel{font:600 11px var(--sans);fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.deps{margin:.4rem 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 18px;font-size:.92rem}
.deps li{padding:2px 0}
.arrow{color:var(--muted);margin:0 4px}

.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.role-item{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.role-item .em{font-size:1.4rem;line-height:1.3}
.role-item small{display:block;color:var(--muted);line-height:1.4}

.act{margin:1.2rem 0 .3rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.storylist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.storylist a.story{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text)}
.storylist a.story:hover{border-color:var(--accent);text-decoration:none}
.storylist .t{font-weight:600}
ol.guide{padding-left:1.4rem;max-width:70ch}
ol.guide li{margin:.5rem 0;padding-left:.3rem}

/* file rows */
.rows{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1.7rem minmax(0,1.3fr) minmax(0,2fr) 5.6rem;gap:2px 10px;align-items:baseline;padding:7px 12px;border-top:1px solid var(--border);color:var(--text)}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-bg);text-decoration:none}
.row .em{text-align:center}
.row .path{font-family:var(--mono);font-size:.84rem;word-break:break-all;color:var(--accent)}
.row .path .dir{color:var(--muted)}
.row .purpose{font-size:.9rem;color:var(--muted)}
.row .lines{text-align:right;font-size:.78rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.row .hit{grid-column:2/-1;font-size:.8rem;color:var(--muted)}
.more{display:block;width:100%;background:var(--surface2);border:0;border-top:1px solid var(--border);padding:8px;color:var(--accent);cursor:pointer;font:inherit;font-size:.9rem}
.tagbtn{display:inline-block;font-size:.72rem;background:var(--surface2);color:var(--muted);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle;font-weight:600}

/* part & problems */
.phead{border-left:8px solid var(--pc,var(--accent));padding-left:16px;margin-bottom:1rem}
.problem{margin:16px 0}
.pid{font:700 .78rem var(--mono);background:var(--pc-bg,var(--surface2));color:var(--text);border:1px solid var(--pc,var(--border));border-radius:5px;padding:1px 7px;margin-right:8px;vertical-align:middle}
.problem .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);margin-top:.9rem;display:block}
.problem .rows,.step .rows{margin-top:10px}
.sub-h{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:14px 0 6px}
.placeholder-note{font-size:.88rem;color:var(--muted);font-style:italic}

/* story */
.cmd{display:flex;align-items:stretch;gap:0;margin:1rem 0;max-width:min(80ch,100%)}
.cmd code{flex:1;min-width:0;background:#161a22;color:#e6e9ef;padding:10px 14px;border-radius:8px 0 0 8px;overflow-x:auto;white-space:pre;font-size:.9rem}
.cmd button{border:1px solid var(--border);border-left:0;background:var(--surface);color:var(--text);padding:0 14px;border-radius:0 8px 8px 0;cursor:pointer;font:inherit;font-size:.88rem}
.cmd button:hover{background:var(--surface2)}
ol.steps{list-style:none;padding:0;margin:1rem 0;counter-reset:s}
.step{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:12px;margin:18px 0}
.step .n{width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--surface);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
:root[data-theme=dark] .step .n{color:#0d1220}
.step p{margin:.2rem 0 0}
.pn{display:flex;justify-content:space-between;gap:14px;margin-top:2.4rem;flex-wrap:wrap}
.pn>span{flex:0 1 48%}
.pn a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text)}
.pn a small{display:block;color:var(--muted)}
.pn a:hover{border-color:var(--accent);text-decoration:none}

/* all files */
.filters{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin:1rem 0;box-shadow:var(--shadow)}
.filters input[type=search]{width:100%;max-width:520px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chiprow .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;width:4.6rem}
.chip{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:2px 11px;font:inherit;font-size:.84rem;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
:root[data-theme=dark] .chip[aria-pressed=true]{color:#0d1220}
.chip .c{opacity:.7;font-size:.78rem;margin-left:3px}
details.folder{margin:2px 0}
details.folder>summary{cursor:pointer;padding:5px 8px;border-radius:6px;font-family:var(--mono);font-size:.86rem;list-style:none;display:flex;gap:8px;align-items:baseline}
details.folder>summary::-webkit-details-marker{display:none}
details.folder>summary::before{content:"\25B8";color:var(--muted);display:inline-block;width:.9em;transition:transform .12s}
details.folder[open]>summary::before{transform:rotate(90deg)}
details.folder>summary:hover{background:var(--surface2)}
details.folder>summary .cnt{color:var(--muted);font-size:.78rem;font-family:var(--sans)}
details.folder>.inner{margin-left:14px;padding-left:12px;border-left:1px solid var(--border)}
.tree{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px}
.tree .rows{border:0;border-radius:6px}
.tree-files{margin:2px 0 6px}

/* file view */
.fhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.fpath{font:600 1.2rem var(--mono);word-break:break-all;margin:0}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:2px 12px;font-size:.88rem;color:var(--text)}
a.pill:hover{border-color:var(--accent);text-decoration:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:.8rem 0}
.purpose-big{font-size:1.1rem;max-width:70ch;margin:1rem 0}
.outline,.outline ul{list-style:none;margin:0;padding:0}
.outline{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 14px}
.outline ul{margin-left:1.2rem;padding-left:.9rem;border-left:2px solid var(--border)}
.item{padding:8px 6px;border-radius:8px;transition:background .3s}
.item+.item{border-top:1px dashed var(--border)}
.outline ul .item{border-top:0}
.item.flash{background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent)}
.irow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.kind{display:inline-flex;align-items:center;justify-content:center;min-width:1.5rem;height:1.5rem;border-radius:6px;font:700 .78rem var(--mono);color:#fff;flex:none;align-self:center}
.k-class{background:#7c3aed}.k-function{background:#2563eb}.k-method{background:#0e7490}.k-table{background:#b45309}.k-type{background:#be185d}.k-const{background:#4b5563}.k-value{background:#0f766e}.k-other{background:#4b5563}
.nm{font-weight:700;font-family:var(--mono);font-size:.95rem}
.sig{font-family:var(--mono);font-size:.83rem;color:var(--muted);word-break:break-word}
.ln{font:.78rem var(--mono);color:var(--muted);margin-left:auto}
.ln a{color:var(--accent)}
.prose code,.note code,.tagline code,.purpose code,.purpose-big code,.role code,.small code,.problem code,.role-item code,.hit code,.warnlist code,.story code,.pcard code,.step code,.guide code{background:var(--surface2);font-family:var(--mono);font-size:.88em;border-radius:4px;padding:0 3px}
.note{margin:2px 0 0 2.15rem;font-size:.94rem;max-width:72ch}
.note.none{color:var(--muted);font-style:italic;font-size:.82rem;opacity:.85}
.calls{margin:3px 0 0 2.15rem;font-size:.84rem;color:var(--muted)}
.calls a{font-family:var(--mono);cursor:pointer;margin-right:6px}
.priv{font-size:.7rem;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 5px}
ul.methods{margin:4px 0 0 2.15rem !important;border-left:2px solid var(--border);padding-left:.9rem !important}
.consts{display:flex;flex-wrap:wrap;gap:6px}
.consts code,.names code,.libs code{background:var(--surface2);border-radius:5px;padding:1px 7px}
.imp{display:grid;gap:8px}
.imp-i{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.names{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;font-size:.84rem}
.libs{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--muted);font-style:italic}
.warnlist{list-style:none;padding:0;margin:1rem 0;display:grid;gap:8px;max-width:90ch}
.warnlist li{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:10px;padding:8px 14px;word-break:break-word}
.warnlist a{font-family:var(--mono);font-size:.9em;text-decoration:underline}
.miss{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);border-radius:5px;font-size:.74rem;padding:0 7px;font-weight:600}

@media (max-width:820px){
  main{padding:20px 14px 50px}
  .row{grid-template-columns:1.7rem minmax(0,1fr) 5.6rem}
  .row .purpose{grid-column:2/-1;grid-row:2}
  .row .lines{grid-row:1;grid-column:3}
  .searchbox{order:5;flex:1 1 100%}
  .spacer{display:none}
  .map svg{max-height:340px}
  .pn>span{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" id="brand" href="#/">RepoTour</a>
    <nav class="main" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/stories" data-nav="stories">Stories</a>
      <a href="#/parts" data-nav="parts">Parts</a>
      <a href="#/files" data-nav="files">All files</a>
    </nav>
    <span class="spacer"></span>
    <div class="searchbox" role="search">
      <input id="gsearch" type="search" placeholder="Search files, functions, notes" aria-label="Search" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
      <div class="dropdown" id="dd" hidden></div>
    </div>
    <a class="iconbtn" id="warnbtn" href="#/warnings" hidden aria-label="Warnings">Warnings <span class="badge" id="warncount">0</span></a>
    <button class="iconbtn" id="theme" type="button" aria-label="Toggle light and dark theme">Theme</button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer id="foot"></footer>

"use strict";
const DATA = {"tool": {"name": "RepoTour", "version": "0.1.0", "url": "https://github.com/tejeshkinariwala/repotour"}, "mode": "written", "project": {"name": "Zustand", "tagline": "A small state-management library for React, built on a framework-free store with optional middleware.", "overview": "Zustand keeps application state in a store object that lives outside React. A store holds one state value, lets you read it, replace or merge into it, and subscribe to changes. `src/vanilla.ts` implements that store and does not import React.\n\n`src/react.ts` wraps a store in a hook built on `useSyncExternalStore`, so components re-render when the slice of state they select changes. Middleware in `src/middleware/` are functions that wrap the function you pass to `create`, to add persistence, Redux DevTools, Immer-style updates and similar features.\n\nThe repo also holds the Rollup build that publishes several entry points (`zustand`, `zustand/vanilla`, `zustand/middleware`, `zustand/shallow`, `zustand/traditional`, `zustand/middleware/immer`) and a Vitest suite in `tests/`. The `docs/` site and `examples/` apps are excluded from this tour.", "repo_url": "https://github.com/pmndrs/zustand", "branch": "main"}, "built_at": "2026-09-29 12:54 +08:00", "stats": {"files": 37, "lines": 9520, "languages": {"typescript": 32, "javascript": 2, "json": 2, "yaml": 1}}, "roles": [{"id": "conductor", "emoji": "🎬", "name": "Conductor", "meaning": "Starts things and calls other files in order: entry points, CLIs, servers, scripts, build steps."}, {"id": "rulebook", "emoji": "📐", "name": "Rulebook", "meaning": "Defines what things must look like: types, schemas, interfaces, base classes, constants, registries. Does little work itself."}, {"id": "worker", "emoji": "⚙️", "name": "Worker", "meaning": "Does the actual work: the core logic, algorithms and transformations."}, {"id": "guard", "emoji": "🛡️", "name": "Guard", "meaning": "Checks something and refuses or stops when it is wrong: validation, auth, permissions, limits."}, {"id": "storekeeper", "emoji": "📦", "name": "Storekeeper", "meaning": "Saves and loads data: databases, caches, files, queues, migrations."}, {"id": "courier", "emoji": "🔌", "name": "Courier", "meaning": "Talks to the outside world: HTTP clients, API adapters, SDK wrappers, messaging."}, {"id": "analyst", "emoji": "🔍", "name": "Analyst", "meaning": "Measures and reports: metrics, logging, statistics, reports, charts."}, {"id": "face", "emoji": "🖼️", "name": "Face", "meaning": "What a user sees: UI components, pages, views, templates, styles."}, {"id": "config", "emoji": "🗂️", "name": "Settings", "meaning": "A file of settings or records that code reads."}, {"id": "helper", "emoji": "🧩", "name": "Helper", "meaning": "Small shared utilities and package markers."}, {"id": "test", "emoji": "🧪", "name": "Test", "meaning": "Automated test that checks other files still behave as before."}], "parts": [{"id": "core", "name": "Store core", "role": "Holds the state, applies updates and notifies subscribers, without any React code.", "summary": "`createStore` in `src/vanilla.ts` builds a store with `setState`, `getState`, `getInitialState` and `subscribe`. The same file defines the shared TypeScript types, including the `StoreMutators` interface that middleware extend. `src/index.ts` is the package entry: it re-exports the core, the React hook and every middleware except Immer.", "folders": ["src/vanilla.ts/", "src/index.ts/"], "color": "#2563eb", "problems": ["C1", "C2"], "files": 5, "lines": 635}, {"id": "react", "name": "React bindings", "role": "Connects a store to components and avoids re-renders when the selected value did not change.", "summary": "`create` in `src/react.ts` builds a store and returns a hook that reads it through `React.useSyncExternalStore`. `src/traditional.ts` offers the same API on the `use-sync-external-store` shim, with an optional equality function. The shallow files compare selector results by their top-level entries.", "folders": ["src/react.ts/", "src/react/", "src/vanilla/", "src/shallow.ts/", "src/traditional.ts/"], "color": "#16a34a", "problems": ["R1", "R2", "R3"], "files": 9, "lines": 1523}, {"id": "middleware", "name": "Middleware", "role": "Wraps a store initializer to add persistence, DevTools, Immer updates and other behaviour.", "summary": "Each middleware takes a state initializer (a function `(set, get, api) => state`) and returns another one. Most replace or wrap `api.setState` or `api.subscribe` before calling the inner initializer. Each file also adds an entry to `StoreMutators` in `src/vanilla.ts` through `declare module`, so TypeScript knows which methods the store gained. `src/middleware.ts` re-exports all middleware except `immer`, which is imported from `zustand/middleware/immer`.", "folders": ["src/middleware/", "src/middleware.ts/"], "color": "#d97706", "problems": ["M1", "M2", "M3", "M4", "M5", "M6", "M7"], "files": 14, "lines": 6867}, {"id": "build", "name": "Build and tooling", "role": "Compiles the source into the published package and configures tests, types and linting.", "summary": "`rollup.config.mjs` builds one CommonJS file and one ESM file per entry point, chosen by a `--config-\u003centry>` flag that the scripts in `package.json` pass. `vitest.config.mts` and `tsconfig.json` map `zustand` imports to `src/` so tests run against source. ESLint and TypeScript settings live in the other root config files.", "folders": ["./", "tests/"], "color": "#7c3aed", "problems": ["B1", "B2", "B3"], "files": 9, "lines": 495}], "part_links": [{"from": "core", "to": "react", "imports": 1}, {"from": "core", "to": "middleware", "imports": 2}, {"from": "react", "to": "core", "imports": 5}, {"from": "middleware", "to": "core", "imports": 16}, {"from": "middleware", "to": "build", "imports": 2}], "problems": [{"id": "C1", "part": "core", "title": "State has to live outside React and still notify whoever depends on it", "without": "Each app would hand-write its own state holder, listener set and merge logic, and code outside React (timers, sockets, tests) could not read or change state.", "fix": "`createStore` in `src/vanilla.ts` keeps `state` and a `Set` of listeners in a closure. `setState` computes the next state, skips the update when it is identical to the current one, merges or replaces it, then calls every listener with the new and previous state.", "files": ["src/vanilla.ts"], "tests": ["tests/vanilla/basic.test.ts", "tests/vanilla/subscribe.test.tsx"], "placeholder": false}, {"id": "C2", "part": "core", "title": "Users need one import path for the store, the hook and the middleware", "without": "Users would import from several internal files and could not rely on the file layout staying the same.", "fix": "`src/index.ts` re-exports `src/vanilla.ts` and `src/react.ts`, and re-exports `redux`, `devtools`, `subscribeWithSelector`, `combine`, `persist`, `createJSONStorage` and `ssrSafe` (as `unstable_ssrSafe`) from the middleware files. `immer` is not re-exported here.", "files": ["src/index.ts"], "tests": ["tests/types.test.tsx"], "placeholder": false}, {"id": "R1", "part": "react", "title": "A component must read store state and re-render when its slice changes", "without": "Components would need their own subscription and force-update code, and could tear (show different state in one render) under concurrent rendering.", "fix": "`useStore` in `src/react.ts` calls `React.useSyncExternalStore` with `api.subscribe` and a snapshot function that applies the selector. `create` calls `createStore` and returns a hook with the store methods copied onto it; called with no argument it returns the curried form `create\u003cT>()(initializer)`. The server snapshot uses `api.getInitialState`.", "files": ["src/react.ts"], "tests": ["tests/basic.test.tsx", "tests/ssr.test.tsx"], "placeholder": false}, {"id": "R2", "part": "react", "title": "A selector that returns a new object or array re-renders on every update", "without": "A selector like `(s) => ({ a: s.a, b: s.b })` returns a new object each call, so `useSyncExternalStore` sees a change every time and the component re-renders on every store update.", "fix": "`shallow` in `src/vanilla/shallow.ts` compares two values by their top-level entries. `useShallow` in `src/react/shallow.ts` wraps a selector and returns the previous result when `shallow` says the new one is equal. `src/shallow.ts` exports both from `zustand/shallow`.", "files": ["src/vanilla/shallow.ts", "src/react/shallow.ts", "src/shallow.ts"], "tests": ["tests/shallow.test.tsx", "tests/vanilla/shallow.test.tsx"], "placeholder": false}, {"id": "R3", "part": "react", "title": "Some apps need a custom equality check, or a React version without useSyncExternalStore", "without": "Apps on the older API would not be able to pass an equality function to a hook, and could not use Zustand hooks that take one.", "fix": "`src/traditional.ts` provides `createWithEqualityFn` and `useStoreWithEqualityFn`. They use `useSyncExternalStoreWithSelector` from the `use-sync-external-store` shim and accept an equality function per hook call or as a default for the store.", "files": ["src/traditional.ts"], "tests": [], "placeholder": false}, {"id": "M1", "part": "middleware", "title": "State is lost on page reload", "without": "Every visit would start from the initial state, and each app would write its own load, save, version and migration code.", "fix": "`persist` in `src/middleware/persist.ts` saves the state to a storage after every `set` and loads it when the store is created. `createJSONStorage` turns a string storage such as `localStorage` into a JSON storage. On load it checks the stored version, calls `migrate` when versions differ, and merges the stored state into the current one. It handles sync and async storages through `toThenable`. It also adds `api.persist` with `rehydrate`, `hasHydrated`, `onHydrate`, `onFinishHydration`, `setOptions`, `getOptions` and `clearStorage`.", "files": ["src/middleware/persist.ts"], "tests": ["tests/persistSync.test.tsx", "tests/persistAsync.test.tsx"], "placeholder": false}, {"id": "M2", "part": "middleware", "title": "State changes are hard to inspect while debugging", "without": "Developers would have no action log, no time travel, and no way to set state from the browser while debugging.", "fix": "`devtools` in `src/middleware/devtools.ts` connects to the Redux DevTools browser extension when it exists and `enabled` allows it. It replaces `api.setState` so each update sends an action and the new state to the extension, and it applies DevTools messages such as `JUMP_TO_STATE` back to the store. The `store` option lets several stores share one connection, and `api.devtools.cleanup` closes the subscription.", "files": ["src/middleware/devtools.ts"], "tests": ["tests/devtools.test.tsx"], "placeholder": false}, {"id": "M3", "part": "middleware", "title": "Updating deeply nested state needs verbose spread code", "without": "Each nested update would need a hand-written chain of object spreads.", "fix": "`immer` in `src/middleware/immer.ts` replaces `store.setState` so that when it is given a function, the function is wrapped with Immer's `produce` and can mutate a draft. Non-function values pass through unchanged.", "files": ["src/middleware/immer.ts"], "tests": ["tests/immer.test.tsx"], "placeholder": false}, {"id": "M4", "part": "middleware", "title": "A listener should run only when one slice of state changes", "without": "Plain `subscribe` calls the listener on every state change, so each listener would have to compare old and new slices itself.", "fix": "`subscribeWithSelector` in `src/middleware/subscribeWithSelector.ts` replaces `api.subscribe` with a version that accepts a selector, a listener and options (`equalityFn`, `fireImmediately`). The listener runs only when the selected slice differs.", "files": ["src/middleware/subscribeWithSelector.ts"], "tests": ["tests/subscribe.test.tsx"], "placeholder": false}, {"id": "M5", "part": "middleware", "title": "There are other common ways to define store state", "without": "Users who prefer a Redux-style reducer, or want state and actions typed separately, would have to write that wiring themselves.", "fix": "`redux` in `src/middleware/redux.ts` builds a store from a reducer and initial state and adds a `dispatch` function. `combine` in `src/middleware/combine.ts` merges an initial state object with the result of a creator function, which lets TypeScript infer the state type.", "files": ["src/middleware/redux.ts", "src/middleware/combine.ts"], "tests": [], "placeholder": false}, {"id": "M6", "part": "middleware", "title": "A store shared between server and client can be updated during server rendering", "without": "State set during server rendering would be lost or leak between requests, and nothing would report the mistake.", "fix": "`ssrSafe` in `src/middleware/ssrSafe.ts` checks `isSSR` (true when `window` is undefined). When true, it replaces `set` and `api.setState` with a function that throws. It is exported as `unstable_ssrSafe` and its source comments say it is experimental.", "files": ["src/middleware/ssrSafe.ts"], "tests": [], "placeholder": false}, {"id": "M7", "part": "middleware", "title": "Users need one import path for the middleware, and their types must compose", "without": "Users would import from each middleware file, and nothing would check that stacked middleware keep their types.", "fix": "`src/middleware.ts` re-exports the middleware files except `immer`. Type composition is checked by `tests/middlewareTypes.test.tsx`.", "files": ["src/middleware.ts"], "tests": ["tests/middlewareTypes.test.tsx"], "placeholder": false}, {"id": "B1", "part": "build", "title": "One source tree must ship as CommonJS, ESM and type declarations for several entry points", "without": "Consumers on different module systems and bundlers could not import the package, and each entry point would need a hand-written build.", "fix": "`rollup.config.mjs` returns a CommonJS config and an ESM config for the entry named by a `--config-\u003cname>` flag, plus a declarations config for the main entry. `package.json` scripts run it once per entry, then patch type declarations and copy files into `dist`. The `exports` map in `package.json` exposes each entry.", "files": ["package.json", "rollup.config.mjs", "pnpm-workspace.yaml"], "tests": [], "placeholder": false}, {"id": "B2", "part": "build", "title": "Source files need type checking, linting and shared type declarations", "without": "Type errors and style problems would reach the published package, and `import.meta.env` would not type check.", "fix": "`tsconfig.json` sets compiler options and maps `zustand` imports to `src/`. `eslint.config.mjs` sets lint rules. `src/types.d.ts` declares `ImportMeta.env` with a `MODE` field, which `devtools.ts` reads.", "files": ["tsconfig.json", "eslint.config.mjs", "src/types.d.ts"], "tests": [], "placeholder": false}, {"id": "B3", "part": "build", "title": "Tests must run against the source, not a built package", "without": "Tests would need a build first, and `import from 'zustand'` would resolve to an installed copy.", "fix": "`vitest.config.mts` aliases `zustand` and `zustand/*` to files in `src/`, runs tests in jsdom and loads `tests/setup.ts`. `tests/test-utils.ts` holds JSON helpers for Map values and a `sleep` function used by the persist tests.", "files": ["vitest.config.mts", "tests/setup.ts", "tests/test-utils.ts"], "tests": [], "placeholder": false}], "stories": [{"id": "S1", "act": "Act 1: Use a store", "title": "A component reads and updates a counter", "command": "const useBear = create((set) => ({ bears: 0, add: () => set((s) => ({ bears: s.bears + 1 })) }))", "summary": "`create` builds a store and a hook. A component calls the hook with a selector, and calling `add` updates the store and re-renders subscribers whose selected value changed.", "steps": [{"text": "The user imports `create` from `zustand`. `src/index.ts` re-exports it from `src/react.ts`.", "files": ["src/index.ts", "src/react.ts"]}, {"text": "`create` calls `createImpl`, which calls `createStore(createState)`. `createStoreImpl` builds `setState`, `getState`, `getInitialState` and `subscribe`, then calls `createState(setState, getState, api)` and keeps the result as both the state and the initial state.", "files": ["src/react.ts", "src/vanilla.ts"]}, {"text": "`createImpl` defines `useBoundStore`, which calls `useStore(api, selector)`, and copies the store methods onto it with `Object.assign`. `create` returns it.", "files": ["src/react.ts"]}, {"text": "A component calls `useBear((s) => s.bears)`. `useStore` calls `React.useSyncExternalStore(api.subscribe, () => selector(api.getState()), () => selector(api.getInitialState()))`.", "files": ["src/react.ts"]}, {"text": "A click handler calls `add`, which calls `set`. `setState` calls the updater, returns early if the result is identical (`Object.is`) to the current state, otherwise merges it with `Object.assign({}, state, nextState)` and calls every listener with the new and previous state.", "files": ["src/vanilla.ts"]}, {"text": "React calls the snapshot function again. If the selected value differs from the last one, the component re-renders.", "files": ["src/react.ts"]}]}, {"id": "S2", "act": "Act 1: Use a store", "title": "Code outside React uses a store", "command": "import { createStore } from 'zustand/vanilla'", "summary": "`createStore` alone gives a working store with no React import. Callers read state, subscribe and update it directly.", "steps": [{"text": "`createStore(initializer)` returns the store `api`. Called with no argument it returns `createStoreImpl`, so the curried form `createStore\u003cT>()(initializer)` works.", "files": ["src/vanilla.ts"]}, {"text": "`api.subscribe(listener)` adds the listener to a `Set` and returns a function that deletes it.", "files": ["src/vanilla.ts"]}, {"text": "`api.setState(partial, replace)` notifies listeners only when the next state is not identical to the current one. With `replace` true, or when the next state is not an object, the state is replaced rather than merged.", "files": ["src/vanilla.ts"]}, {"text": "`api.getInitialState()` returns the value from when the store was created, and `api.getState()` returns the current one. The tests in `tests/vanilla/basic.test.ts` check these cases.", "files": ["src/vanilla.ts", "tests/vanilla/basic.test.ts"]}]}, {"id": "S3", "act": "Act 1: Use a store", "title": "A selector returns a new object and the component re-renders too often", "command": "const { a, b } = useStore(useShallow((s) => ({ a: s.a, b: s.b })))", "summary": "`useShallow` keeps the previous selector result when the new one has equal top-level entries.", "steps": [{"text": "`useShallow(selector)` returns a function that runs the selector and stores the last result in a `useRef`.", "files": ["src/react/shallow.ts"]}, {"text": "It calls `shallow(prev.current, next)`. `shallow` returns true for identical values, and false for non-objects or objects with different prototypes.", "files": ["src/react/shallow.ts", "src/vanilla/shallow.ts"]}, {"text": "For iterables with `entries` (Map, Set, arrays) it compares entries, for other iterables it compares values in order, and for plain objects it compares `Object.entries`. Values are compared with `Object.is`.", "files": ["src/vanilla/shallow.ts"]}, {"text": "When equal, `useShallow` returns the previous object, so `useSyncExternalStore` sees the same snapshot and skips the re-render.", "files": ["src/react/shallow.ts", "src/react.ts"]}]}, {"id": "S4", "act": "Act 2: Add behaviour with middleware", "title": "State survives a page reload", "command": "create(persist((set) => ({ count: 0 }), { name: 'counter' }))", "summary": "`persist` saves state after each update and restores it when the store is created.", "steps": [{"text": "`create` calls `persist(config, options)`, which returns an initializer. `persistImpl` builds `options`, using `createJSONStorage(() => window.localStorage)` as the default storage, an identity `partialize`, version 0 and a shallow `merge`.", "files": ["src/middleware/persist.ts"]}, {"text": "If `createJSONStorage` could not get a storage (for example `localStorage` is not defined) the initializer returns `config(...)` with a `set` that logs a warning and still updates the state.", "files": ["src/middleware/persist.ts"]}, {"text": "Otherwise `api.setState` and the `set` given to `config` are wrapped so each update also calls `setItem`, which writes `{ state: partialize(state), version }` under `options.name`.", "files": ["src/middleware/persist.ts"]}, {"text": "Unless `skipHydration` is set, `hydrate` runs. It calls `getItem` through `toThenable`, so sync and async storages share one code path. If the stored version differs from `options.version`, it calls `migrate`, or logs an error when there is none.", "files": ["src/middleware/persist.ts"]}, {"text": "The stored state is merged with the current state by `options.merge` and applied with `set(state, true)`. Hydration listeners and `onRehydrateStorage` callbacks run, and a counter (`hydrationVersion`) makes older in-flight hydrations stop when a newer one starts.", "files": ["src/middleware/persist.ts", "src/vanilla.ts"]}, {"text": "The initializer returns `stateFromStorage || configResult`, so with a sync storage the first state already holds the stored values.", "files": ["src/middleware/persist.ts"]}, {"text": "`api.persist` is set before hydration starts. `rehydrate` runs `hydrate` again, `setOptions` merges new options (and switches storage if one is given), `clearStorage` removes the stored item and stops any in-flight hydration, and `onHydrate` and `onFinishHydration` register listeners and return a function that removes them.", "files": ["src/middleware/persist.ts"]}]}, {"id": "S5", "act": "Act 2: Add behaviour with middleware", "title": "A developer inspects a store in Redux DevTools", "command": "create(devtools((set) => ({ count: 0 }), { name: 'counter' }))", "summary": "`devtools` sends each update to the browser extension and applies commands from it.", "steps": [{"text": "`devtoolsImpl` reads `enabled`, `anonymousActionType` and `store` from the options. It looks for `window.__REDUX_DEVTOOLS_EXTENSION__` when `enabled` is true or, if unset, `import.meta.env?.MODE` is not `production`. Without the extension it returns `fn(set, get, api)` unchanged.", "files": ["src/middleware/devtools.ts", "src/types.d.ts"]}, {"text": "`extractConnectionInformation` connects to the extension. With a `store` option, stores with the same `name` share one connection kept in `trackedConnections`.", "files": ["src/middleware/devtools.ts"]}, {"text": "`api.setState` is replaced. It calls the original `set`, then sends `{ type }` and the state to the extension. The type is the action name or object passed as the third argument, else `anonymousActionType`, else a name from `findCallerName` (parsed from the stack), else `anonymous`.", "files": ["src/middleware/devtools.ts"]}, {"text": "The inner initializer runs with the new `api.setState`, and the result is sent with `connection.init`.", "files": ["src/middleware/devtools.ts"]}, {"text": "The extension messages are handled: `JUMP_TO_STATE`, `ROLLBACK` and `IMPORT_STATE` set state through `setStateFromDevtools`, which turns recording off during the update so the change is not sent back. `RESET`, `COMMIT` and `PAUSE_RECORDING` are handled in the same switch.", "files": ["src/middleware/devtools.ts"]}, {"text": "For stores built with `redux`, an action sent from the DevTools calls `api.dispatch` (only when the store has `dispatchFromDevtools`).", "files": ["src/middleware/devtools.ts", "src/middleware/redux.ts"]}]}, {"id": "S6", "act": "Act 2: Add behaviour with middleware", "title": "A developer stacks middleware and adds a new one", "command": "create\u003cState>()(devtools(persist(immer((set) => ({ ... })), { name: 'x' })))", "summary": "A middleware is a function from initializer to initializer. Its type entry in `StoreMutators` tells TypeScript which methods the store gains.", "steps": [{"text": "`create\u003cState>()` is called with no argument, which returns a function that takes the initializer. This form lets TypeScript take the state type from the caller.", "files": ["src/react.ts", "src/vanilla.ts"]}, {"text": "The outermost middleware runs first when the store is created. Each calls the next one with `(set, get, api)`, possibly after replacing `api.setState` or `api.subscribe`. `immer` replaces `store.setState` with a version that wraps function updaters in `produce`.", "files": ["src/middleware/immer.ts"]}, {"text": "`subscribeWithSelector` is another example: it saves `api.subscribe`, replaces it with the selector-aware version, then calls the inner initializer.", "files": ["src/middleware/subscribeWithSelector.ts"]}, {"text": "Each middleware file has a `declare module '../vanilla'` block that adds a key such as `'zustand/immer'` to `StoreMutators`. The `Mutate` type in `src/vanilla.ts` applies these entries in order, so the final store type has the added methods.", "files": ["src/vanilla.ts", "src/middleware/immer.ts", "src/middleware/persist.ts", "src/middleware/devtools.ts"]}, {"text": "To add a middleware: create a file in `src/middleware/`, add its `StoreMutators` entry, export it from `src/middleware.ts` (and from `src/index.ts` if it should be in the main entry), and add tests. `tests/middlewareTypes.test.tsx` checks type composition.", "files": ["src/middleware.ts", "src/index.ts", "tests/middlewareTypes.test.tsx"]}]}, {"id": "S7", "act": "Act 3: Servers and releases", "title": "A component renders on the server and hydrates on the client", "command": "", "summary": "The hook passes `getInitialState` as the server snapshot, and `ssrSafe` can block updates during server rendering.", "steps": [{"text": "During server rendering and hydration, `useSyncExternalStore` calls its third argument, so `useStore` returns `selector(api.getInitialState())`.", "files": ["src/react.ts"]}, {"text": "The hydration render therefore matches the server HTML, and React then re-renders with the current state. `tests/ssr.test.tsx` checks two cases: a `Counter` that increases the store in an effect after hydration, and a `setState` call during hydration, with no console errors in the second case.", "files": ["src/react.ts", "tests/ssr.test.tsx"]}, {"text": "With `ssrSafe`, when `window` is undefined the initializer replaces `api.setState` and the `set` it passes down with a function that throws `Cannot set state of Zustand store in SSR`.", "files": ["src/middleware/ssrSafe.ts"]}]}, {"id": "S8", "act": "Act 3: Servers and releases", "title": "A maintainer builds the package", "command": "pnpm build", "summary": "Rollup runs once per entry point, then scripts patch the output and copy files into `dist`.", "steps": [{"text": "`pnpm build` removes `dist`, runs every `build:*` script, then runs `postbuild`.", "files": ["package.json"]}, {"text": "Each `build:*` script runs `rollup -c` with a flag such as `--config-middleware_immer`. The default function in `rollup.config.mjs` turns the flag into an entry path (`_` becomes `/`) and returns a CommonJS config and an ESM config. `index` also gets a declarations config.", "files": ["rollup.config.mjs", "package.json"]}, {"text": "Both configs mark non-relative imports as external, alias the other entry points to `zustand/...` paths from the `entries` list so they are not bundled twice, and replace `import.meta.env?.MODE`.", "files": ["rollup.config.mjs"]}, {"text": "`postbuild` rewrites paths in declarations, copies `dist/src/*` into place, writes a `dist/package.json` with `private` false, and renames ESM declarations to `.d.mts`.", "files": ["package.json"]}]}], "guide": [{"text": "Read the map first: it lists the four parts and how they depend on each other.", "story": null, "part": null}, {"text": "the ma function mapSvg() {
  const parts = D.parts;

  const links = D.part_links.filter(l => ids.has(str(l.from)) && ids.has(str(l.to)) && l.from !== l.to && num(l.imports) > 0);
  let h = `<div class="map">`;
  if (parts.length <= 10 && parts.length > 0) {
    const W = 780, H = parts.length === 1 ? 160 : parts.length <= 3 ? 280 : 350, nw = 168, nh = 58;
    const cx = W / 2, cy = H / 2, rx = W / 2 - nw / 2 - 30, ry = H / 2 - nh / 2 - 26;
    const pos = {};

      const s = clipPt(a, c), e = clipPt(b, c);
      const w = 1.5 + 4.5 * num(l.imports) / max;
      const lx = 0.25 * s.x + 0.5 * c.x + 0.25 * e.x, ly = 0.25 * s.y + 0.5 * c.y + 0.25 * e.y;
      const nameA = (D.partById[l.from] || {}).name, nameB = (D.partById[l.to] || {}).name;
      edges += `<g><title>${esc(nameA)} imports from ${esc(nameB)}: ${num(l.imports)} file-to-file imports</title>` +
        `<path class="edge" d="M${s.x.toFixed(1)},${s.y.toFixed(1)} Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${e.x.toFixed(1)},${e.y.toFixed(1)}" stroke-width="${w.toFixed(1)}" marker-end="url(#ah)"/>` +
        `<text class="elabel" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle">${num(l.imports)}</text></g>`;
    });
    let nodes = "";
    parts.forEach(p => {
      const q = pos[p.id];
      nodes += `<a href="${partHref(p.id)}" class="node" style="--pc:${esc(p.color)}"><rect x="${(q.x - nw / 2).toFixed(1)}" y="${(q.y - nh / 2).toFixed(1)}" width="${nw}" height="${nh}" rx="10"/>` +
        `<text x="${q.x.toFixed(1)}" y="${(q.y - 3).toFixed(1)}" text-anchor="middle">${esc(clip(p.name, 20))}</text>` +
        `<text class="sub" x="${q.x.toFixed(1)}" y="${(q.y + 15).toFixed(1)}" text-anchor="middle">${plural(p.files, "file")} &middot; ${fmt(p.lines)} lines</text></a>`;
    });
    h += `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagram of the parts and which parts import from which. Arrows point from the importing part to the part it uses.">` +
      `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>` +
      edges + nodes + `</svg>`;
  }
  if (links.length) {
    h += `<div style="padding:6px 12px 10px"><div class="sub-h" style="margin-top:4px">Which part uses which <span style="text-transform:none;letter-spacing:0;font-weight:400">(arrow points to the part being used; number = files importing files)</span></div><ul class="deps">` +
      links.slice().sort((a, b) => num(b.imports) - num(a.imports)).map(l =>
        `<li>${partLink(l.from)}<span class="arrow">&rarr;</span>${partLink(l.to)} <span class="muted small">${plural(num(l.imports), "import")}</span></li>`).join("") + `</ul></div>`;

  }

}

/* ---- search index ---- */
let IDX = null;

    acc.push(str(it.name), str(it.signature), noTicks(it.note));
    arr(it.methods).forEach(m => acc.push(str(obj(m).name), noTicks(obj(m).note)));
    outlineNames(it.children, acc);

}
function buildIndex() {
  if (IDX) return IDX;

    const f = F(p);
    const names = outlineNames(obj(f.outline).items, []);
    return {p, s: (p + " " + noTicks(f.purpose) + " " + names.join(" ")).toLowerCase(), n: names.map(x => x.toLowerCase())};

    else h += `<ul class="outline">${items.map(it => itemHtml(it, path, ids, false)).join("")}</ul>`;
    const consts = arr(ol.consts);
    if (consts.length) h += `<div class="sub-h">Constants</div><div class="consts">${consts.map(c => `<code>${esc(c)}</code>`).join("")}</div>`;
  }

  h += `<h2>Imports</h2><p class="muted small" style="margin-top:-.4rem">Other files in this repo that this file uses.</p>`;
  const imps = arr(f.imports).map(obj).filter(i => i.file);
  h += imps.length ? `<div class="imp">` + imps.map(i => {
    const nm = arr(i.names);
    return `<div class="imp-i">${fileInline(i.file)}${nm.length ? `<div class="names">${nm.map(x => `<code>${esc(x)}</code>`).join("")}</div>` : ""}</div>`;
  }).join("") + `</div>` : `<p class="empty">Imports no other file in this repo.</p>`;

  h += `<h2>Libraries</h2>`;
  const libs = arr(f.libs);
  h += libs.length ? `<div class="libs">${libs.map(l => `<code>${esc(l)}</code>`).join("")}</div>` : `<p class="empty">No outside libraries.</p>`;

  h += `<h2>Used by</h2>`;
  const ub = strs(f.used_by);
  h += ub.length ? rowsBlock(ub, 150) : `<p class="empty">No other file imports this one.</p>`;
  return h;
}
function fileInline(p) {
  const f = F(p);
  return `<a href="${fileHref(p)}"><span title="${esc(f ? roleName(f.role) : "")}">${esc(f ? roleEmoji(f.role) : "?")}</span> <span class="mono">${esc(p)}</span></a>` +
    (f && f.purpose ? ` <span class="muted small">${pr(clip(f.purpose, 110))}</span>` : "");
}
function countMissing(items) {
  let c = 0;
  arr(items).forEach(it => { it = obj(it); if (!str(it.note).trim()) c++; arr(it.methods).forEach(m => { if (!str(obj(m).note).trim()) c++; }); c += countMissing(it.children); });
  return c;
}
function lineLink(path, line) {
  if (!line) return "";
  const u = sourceUrl(path, line);
  return `<span class="ln">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="View source at line ${esc(line)}">L${esc(line)}</a>` : "L" + esc(line)}</span>`;
}
function itemHtml(it, path, ids, isChild) {
  it = obj(it);
  const kind = str(it.kind) || "function";
  const kcls = ["class", "function", "method", "table", "type", "const", "value"].includes(kind) ? kind : "other";
  const glyph = {class: "C", function: "ƒ", method: "m", table: "▦", type: "T", const: "=", value: "v"}[kind] || kind.charAt(0).toUpperCase();
  const id = ids[str(it.name)];
  const sig = str(it.signature) && str(it.signature) !== str(it.name) ? `<code class="sig">${esc(it.signature)}</code>` : "";
  let h = `<li class="item" ${id ? `id="${id}"` : ""}><div class="irow"><span class="kind k-${kcls}" title="${esc(kind)}" aria-label="${esc(kind)}">${esc(glyph)}</span><span class="nm">${esc(it.name)}</span>${sig}` +
    (it.exported === false ? `<span class="priv" title="Not part of the public interface">private</span>` : "") + lineLink(path, it.line) + `</div>`;
  h += noteHtml(it.note);
  const calls = arr(it.calls).map(str).filter(Boolean);
  if (calls.length) h += `<div class="calls">calls &rarr; ` + calls.map(c => ids[c] ? `<a data-goto="${ids[c]}" role="link" tabindex="0">${esc(c)}</a>` : `<code>${esc(c)}</code>`).join(" ") + `</div>`;
  const methods = arr(it.methods).map(obj);
  if (methods.length) h += `<ul class="methods">` + methods.map(m =>
    `<li class="item"><div class="irow"><span class="kind k-method" title="method" aria-label="method">m</span><span class="nm">${esc(m.name)}</span>` +
    (str(m.signature) && m.signature !== m.name ? `<code class="sig">${esc(m.signature)}</code>` : "") + lineLink(path, m.line) + `</div>${noteHtml(m.note)}</li>`).join("") + `</ul>`;
  const kids = arr(it.children);
  if (kids.length) h += `<ul>` + kids.map(k => itemHtml(k, path, ids, true)).join("") + `</ul>`;
  return h + `</li>`;
}
function noteHtml(n) {
  n = str(n).trim();
  if (n) return `<div class="note">${pr(n)}</div>`;
  return D.mode === "written" ? `<div class="note none">no note yet</div>` : "";
}

function viewWarnings() {
  const paths = new Set(D.paths);
  let h = `<h1>Warnings</h1>`;
  if (!D.warnings.length) return h + `<p class="empty">No warnings. Everything in the written tour matches the code.</p>`;
  h += `<p class="muted prose">The tour and the code disagree in these places. Fix them in <code>.repotour/</code> and build again.</p><ul class="warnlist">` +
    D.warnings.map(w => `<li>${pr(w).replace(/[^\s'"(),:;]+/g, tok => { const raw = tok.replace(/&amp;/g, "&"); return paths.has(raw) ? `<a href="${fileHref(raw)}">${tok}</a>` : tok; })}</li>`).join("") + `</ul>`;
  return h;
}
function notFound(kind, id) {
  return `<h1>Not found</h1><p>There is no ${esc(kind)} called <code>${esc(id)}</code> in this tour.</p><p><a href="#/">Back to the home page</a></p>`;
}

/* ---------- router ---------- */
function parseHash() {
  let h = location.hash.replace(/^#/, "");
  if (h.charAt(0) !== "/") h = "/" + h;
  let query = "";
  const qi = h.indexOf("?");
  if (qi >= 0) { query = h.slice(qi + 1); h = h.slice(0, qi); }
  // a #p-<id> anchor after a part route
  const ai = h.indexOf("#");
  let anchor = "";
  if (ai >= 0) { anchor = h.slice(ai + 1); h = h.slice(0, ai); }
  const segs = h.split("/").filter((s, i) => i > 0 || s !== "");
  const dec = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
  return {name: dec(segs[0] || ""), arg: segs.slice(1).map(dec).join("/"), query: new URLSearchParams(query), anchor};
}
let lastKey = "";
function render() {
  const r = parseHash();
  const app = $("#main");
  let html, title = D.project.name, nav = "home";
  try {
    switch (r.name) {
      case "part": html = viewPart(r.arg); nav = "parts"; title = (D.partById[r.arg] || {}).name || "Part"; break;
      case "parts": html = viewParts(); nav = "parts"; title = "Parts"; break;
      case "story": html = viewStory(r.arg); nav = "stories"; title = (D.storyById[r.arg] || {}).title || "Story"; break;
      case "stories": html = viewStories(); nav = "stories"; title = "Stories"; break;
      case "file": html = viewFile(r.arg); nav = "files"; title = r.arg.split("/").pop(); break;
      case "files": html = viewFiles(r.query); nav = "files"; title = "All files"; break;
      case "warnings": html = viewWarnings(); nav = ""; title = "Warnings"; break;
      default: html = viewHome();
    }
  } catch (e) {
    console.error(e);
    html = `<h1>Something went wrong</h1><p>This view could not be drawn: <code>${esc(e && e.message)}</code></p>`;
  }
  app.innerHTML = html;
  document.title = (title === D.project.name ? title : title + " · " + D.project.name);
  document.querySelectorAll("nav.main a").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (r.name === "files") updateFilesResults();
  const key = r.name + "/" + r.arg;
  if (r.anchor && $("#" + CSS.escape(r.anchor))) { $("#" + CSS.escape(r.anchor)).scrollIntoView(); }
  else if (key !== lastKey || r.name !== "files") window.scrollTo(0, 0);
  lastKey = key;
  closeDd();
}
window.addEventListener("hashchange", render);

/* ---------- events ---------- */
function flash(id) {
  const el = document.getElementById(id); if (!el) return;
  el.scrollIntoView({block: "center", behavior: "smooth"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1800);
}
function copyText(t, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
}
$("#main").addEventListener("click", e => {
  const t = e.target.closest("[data-goto],[data-copy],[data-more],[data-chip]");
  if (!t) return;
  if (t.dataset.goto) { e.preventDefault(); flash(t.dataset.goto); }
  else if (t.dataset.copy != null) copyText(t.dataset.copy, t);
  else if (t.dataset.more) {
    const m = MORE[t.dataset.more]; if (!m) return;
    const wrap = document.createElement("div"); wrap.innerHTML = m.paths.map(p => fileRow(p, m.opts)).join("");
    const parent = t.parentNode; parent.removeChild(t);
    while (wrap.firstChild) parent.appendChild(wrap.firstChild);
    delete MORE[t.dataset.more];
  } else if (t.dataset.chip) {
    const k = t.dataset.chip, v = t.dataset.val;
    FS[k] = FS[k] === v ? "" : v;
    history.replaceState(null, "", filesQuery());
    document.querySelectorAll('[data-chip="' + k + '"]').forEach(b => b.setAttribute("aria-pressed", String(FS[k] === b.dataset.val)));
    updateFilesResults();
  }
});
$("#main").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.goto) { e.preventDefault(); flash(e.target.dataset.goto); }
});
$("#main").addEventListener("input", e => {
  if (e.target.id !== "fq") return;
  clearTimeout(fqTimer);
  fqTimer = setTimeout(() => { FS.q = e.target.value; history.replaceState(null, "", filesQuery()); updateFilesResults(); }, 120);
});
let fqTimer = 0;
$("#main").addEventListener("toggle", e => {
  const d = e.target;
  if (!d.dataset || !d.dataset.tree || !d.open) return;
  const t = TREE[d.dataset.tree];
  if (t && !t.built) { t.built = true; d.querySelector(".inner").innerHTML = folderBody(d.dataset.tree); }
}, true);

/* global search */
const gs = $("#gsearch"), dd = $("#dd");
let ddItems = [], ddSel = -1, gsTimer = 0;
function closeDd() { dd.hidden = true; ddSel = -1; }
function updateDd() {
  const words = matchWords(gs.value);
  if (!words.length) { closeDd(); return; }
  const hit = s => words.every(w => s.toLowerCase().includes(w));
  let h = "";
  const ps = D.parts.filter(p => hit(p.name + " " + p.role)).slice(0, 3);
  const ss = D.stories.filter(s => hit(s.title + " " + s.summary)).slice(0, 3);
  const fs = buildIndex().filter(e => words.every(w => e.s.includes(w))).slice(0, 8);
  const total = buildIndex().filter(e => words.every(w => e.s.includes(w))).length;
  if (ps.length) h += `<div class="dd-h">Parts</div>` + ps.map(p => `<a class="dd-i" href="${partHref(p.id)}">${esc(p.name)}<span class="muted">${esc(clip(p.role, 50))}</span></a>`).join("");
  if (ss.length) h += `<div class="dd-h">Stories</div>` + ss.map(s => `<a class="dd-i" href="${storyHref(s.id)}">${esc(s.title)}</a>`).join("");
  if (fs.length) h += `<div class="dd-h">Files</div>` + fs.map(e => `<a class="dd-i" href="${fileHref(e.p)}">${esc(roleEmoji(F(e.p).role))} <span class="mono">${esc(e.p)}</span></a>`).join("");
  h += `<a class="dd-i" href="#/files?q=${encodeURIComponent(gs.value.trim())}"><b>See all ${fmt(total)} matching files</b></a>`;
  dd.innerHTML = h; dd.hidden = false;
  ddItems = [...dd.querySelectorAll(".dd-i")]; ddSel = -1;
}
gs.addEventListener("input", () => { clearTimeout(gsTimer); gsTimer = setTimeout(updateDd, 100); });
gs.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (dd.hidden) return;
    e.preventDefault();
    ddSel = (ddSel + (e.key === "ArrowDown" ? 1 : -1) + ddItems.length) % ddItems.length;
    ddItems.forEach((a, i) => a.classList.toggle("sel", i === ddSel));
    ddItems[ddSel].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (ddSel >= 0 && ddItems[ddSel]) location.hash = ddItems[ddSel].getAttribute("href");
    else if (gs.value.trim()) location.hash = "#/files?q=" + encodeURIComponent(gs.value.trim());
    closeDd();
  }
});
document.addEventListener("click", e => { if (!e.target.closest(".searchbox")) closeDd(); });
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
  if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); gs.focus(); gs.select(); }
  else if (e.key === "Escape") {
    if (gs.value || document.activeElement === gs) { gs.value = ""; closeDd(); gs.blur(); }
    else if (document.activeElement && document.activeElement.id === "fq") { const q = document.activeElement; q.value = ""; FS.q = ""; history.replaceState(null, "", filesQuery()); updateFilesResults(); }
  }
});

/* theme */
const root = document.documentElement;
function setTheme(t, save) {
  root.setAttribute("data-theme", t);
  const b = $("#theme"); b.textContent = t === "dark" ? "☀ Light" : "☾ Dark";
  b.setAttribute("aria-pressed", String(t === "dark"));
  if (save) { try { localStorage.setItem("repotour-theme", t); } catch (e) { /* file:// may block */ } }
}
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem("repotour-theme"); } catch (e) { /* ignore */ }
  if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  setTheme(t, false);
})();
$("#theme").addEventListener("click", () => setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true));

/* chrome */
(function initChrome() {
  $("#brand").textContent = D.project.name;
  if (D.warnings.length) { $("#warnbtn").hidden = false; $("#warncount").textContent = D.warnings.length; $("#warnbtn").setAttribute("aria-label", D.warnings.length + " warnings"); }
  const t = D.tool, when = D.built_at ? " on " + esc(D.built_at) : "";
  const name = /^https?:\/\//i.test(str(t.url)) ? `<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.name)}</a>` : esc(t.name);
  $("#foot").innerHTML = `Built with ${name}${t.version ? " v" + esc(t.version) : ""}${when}.`;
  if (!DATA) $("#main").innerHTML = `<h1>No data</h1><p>This is the empty template. Build a tour with <code>repotour build</code>.</p>`;
})();
if (DATA) render();
</script>
