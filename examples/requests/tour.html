<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoTour</title>
<style>
:root{
  --bg:#f6f6f3; --surface:#ffffff; --surface2:#f0f0ec; --text:#1c2230; --muted:#59616f; --border:#dcdcd5;
  --accent:#2350c8; --accent-bg:#e8eefc; --warn:#8a5300; --warn-bg:#fff3d6; --warn-border:#e8c777;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 2px 8px rgba(20,25,40,.04);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#13161c; --surface:#1b1f27; --surface2:#242933; --text:#e6e9ef; --muted:#a3abb8; --border:#2f3541;
  --accent:#86aaff; --accent-bg:#232f4d; --warn:#f3c56b; --warn-bg:#3a2e14; --warn-border:#6b5320;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:.88em}
h1{font-size:2rem;line-height:1.2;margin:0 0 .4rem;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:2.4rem 0 .8rem;letter-spacing:-.005em}
h3{font-size:1.05rem;margin:0 0 .4rem}
p{margin:.6rem 0}
.prose{max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--surface);padding:6px 10px;z-index:100}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main a{color:var(--muted);padding:6px 10px;border-radius:6px;font-size:.94rem}
nav.main a:hover{background:var(--surface2);text-decoration:none;color:var(--text)}
nav.main a[aria-current=page]{color:var(--accent);background:var(--accent-bg);font-weight:600}
.spacer{flex:1}
.searchbox{position:relative;min-width:200px;flex:0 1 300px}
.searchbox input{width:100%;padding:7px 34px 7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:.92rem}
.searchbox kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:.75rem var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 5px;pointer-events:none}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-height:70vh;overflow:auto;z-index:30;min-width:340px}
.dropdown[hidden]{display:none}
.dd-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 12px 2px}
.dd-i{display:block;padding:6px 12px;color:var(--text);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-i:hover,.dd-i.sel{background:var(--accent-bg);text-decoration:none}
.dd-i .muted{margin-left:6px;font-size:.82rem}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:var(--surface2)}
.badge{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);border-radius:999px;font-size:.75rem;font-weight:700;padding:0 7px;line-height:1.4}

main{max-width:1120px;margin:0 auto;padding:28px 20px 60px;outline:none;min-height:70vh}
footer{max-width:1120px;margin:0 auto;padding:18px 20px 40px;color:var(--muted);font-size:.86rem;border-top:1px solid var(--border)}

.tagline{font-size:1.15rem;color:var(--muted);margin:0 0 1rem;max-width:60ch}
.crumbs{font-size:.88rem;color:var(--muted);margin-bottom:.8rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:1.1rem 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow)}
.stat b{font-size:1.25rem;display:block;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.banner{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:1rem 0;max-width:80ch}
.banner code{background:var(--surface);padding:1px 6px;border-radius:4px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.pcard{border-top:5px solid var(--pc,var(--accent));display:block;color:var(--text)}
a.pcard:hover{text-decoration:none;border-color:var(--pc,var(--accent));transform:translateY(-1px)}
.pcard h3{margin:0 0 2px;font-size:1.1rem}
.pcard .role{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.pcard .nums{font-size:.82rem;color:var(--muted)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--pc,var(--accent));margin-right:6px}
.map{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:var(--shadow);margin-bottom:14px}
.map svg{width:100%;height:auto;display:block;max-height:440px}
.map .node rect{fill:var(--pc);fill-opacity:.16;stroke:var(--pc);stroke-width:2}
.map .node:hover rect{fill-opacity:.3}
.map .node text{fill:var(--text);font:600 14px var(--sans)}
.map .node text.sub{font:12px var(--sans);fill:var(--muted)}
.map .edge{fill:none;stroke:var(--muted);opacity:.75}
.map .elabel{font:600 11px var(--sans);fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.deps{margin:.4rem 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 18px;font-size:.92rem}
.deps li{padding:2px 0}
.arrow{color:var(--muted);margin:0 4px}

.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.role-item{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.role-item .em{font-size:1.4rem;line-height:1.3}
.role-item small{display:block;color:var(--muted);line-height:1.4}

.act{margin:1.2rem 0 .3rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.storylist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.storylist a.story{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text)}
.storylist a.story:hover{border-color:var(--accent);text-decoration:none}
.storylist .t{font-weight:600}
ol.guide{padding-left:1.4rem;max-width:70ch}
ol.guide li{margin:.5rem 0;padding-left:.3rem}

/* file rows */
.rows{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1.7rem minmax(0,1.3fr) minmax(0,2fr) 5.6rem;gap:2px 10px;align-items:baseline;padding:7px 12px;border-top:1px solid var(--border);color:var(--text)}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-bg);text-decoration:none}
.row .em{text-align:center}
.row .path{font-family:var(--mono);font-size:.84rem;word-break:break-all;color:var(--accent)}
.row .path .dir{color:var(--muted)}
.row .purpose{font-size:.9rem;color:var(--muted)}
.row .lines{text-align:right;font-size:.78rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.row .hit{grid-column:2/-1;font-size:.8rem;color:var(--muted)}
.more{display:block;width:100%;background:var(--surface2);border:0;border-top:1px solid var(--border);padding:8px;color:var(--accent);cursor:pointer;font:inherit;font-size:.9rem}
.tagbtn{display:inline-block;font-size:.72rem;background:var(--surface2);color:var(--muted);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle;font-weight:600}

/* part & problems */
.phead{border-left:8px solid var(--pc,var(--accent));padding-left:16px;margin-bottom:1rem}
.problem{margin:16px 0}
.pid{font:700 .78rem var(--mono);background:var(--pc-bg,var(--surface2));color:var(--text);border:1px solid var(--pc,var(--border));border-radius:5px;padding:1px 7px;margin-right:8px;vertical-align:middle}
.problem .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);margin-top:.9rem;display:block}
.problem .rows,.step .rows{margin-top:10px}
.sub-h{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:14px 0 6px}
.placeholder-note{font-size:.88rem;color:var(--muted);font-style:italic}

/* story */
.cmd{display:flex;align-items:stretch;gap:0;margin:1rem 0;max-width:min(80ch,100%)}
.cmd code{flex:1;min-width:0;background:#161a22;color:#e6e9ef;padding:10px 14px;border-radius:8px 0 0 8px;overflow-x:auto;white-space:pre;font-size:.9rem}
.cmd button{border:1px solid var(--border);border-left:0;background:var(--surface);color:var(--text);padding:0 14px;border-radius:0 8px 8px 0;cursor:pointer;font:inherit;font-size:.88rem}
.cmd button:hover{background:var(--surface2)}
ol.steps{list-style:none;padding:0;margin:1rem 0;counter-reset:s}
.step{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:12px;margin:18px 0}
.step .n{width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--surface);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
:root[data-theme=dark] .step .n{color:#0d1220}
.step p{margin:.2rem 0 0}
.pn{display:flex;justify-content:space-between;gap:14px;margin-top:2.4rem;flex-wrap:wrap}
.pn>span{flex:0 1 48%}
.pn a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text)}
.pn a small{display:block;color:var(--muted)}
.pn a:hover{border-color:var(--accent);text-decoration:none}

/* all files */
.filters{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin:1rem 0;box-shadow:var(--shadow)}
.filters input[type=search]{width:100%;max-width:520px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chiprow .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;width:4.6rem}
.chip{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:2px 11px;font:inherit;font-size:.84rem;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
:root[data-theme=dark] .chip[aria-pressed=true]{color:#0d1220}
.chip .c{opacity:.7;font-size:.78rem;margin-left:3px}
details.folder{margin:2px 0}
details.folder>summary{cursor:pointer;padding:5px 8px;border-radius:6px;font-family:var(--mono);font-size:.86rem;list-style:none;display:flex;gap:8px;align-items:baseline}
details.folder>summary::-webkit-details-marker{display:none}
details.folder>summary::before{content:"\25B8";color:var(--muted);display:inline-block;width:.9em;transition:transform .12s}
details.folder[open]>summary::before{transform:rotate(90deg)}
details.folder>summary:hover{background:var(--surface2)}
details.folder>summary .cnt{color:var(--muted);font-size:.78rem;font-family:var(--sans)}
details.folder>.inner{margin-left:14px;padding-left:12px;border-left:1px solid var(--border)}
.tree{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px}
.tree .rows{border:0;border-radius:6px}
.tree-files{margin:2px 0 6px}

/* file view */
.fhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.fpath{font:600 1.2rem var(--mono);word-break:break-all;margin:0}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:2px 12px;font-size:.88rem;color:var(--text)}
a.pill:hover{border-color:var(--accent);text-decoration:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:.8rem 0}
.purpose-big{font-size:1.1rem;max-width:70ch;margin:1rem 0}
.outline,.outline ul{list-style:none;margin:0;padding:0}
.outline{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 14px}
.outline ul{margin-left:1.2rem;padding-left:.9rem;border-left:2px solid var(--border)}
.item{padding:8px 6px;border-radius:8px;transition:background .3s}
.item+.item{border-top:1px dashed var(--border)}
.outline ul .item{border-top:0}
.item.flash{background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent)}
.irow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.kind{display:inline-flex;align-items:center;justify-content:center;min-width:1.5rem;height:1.5rem;border-radius:6px;font:700 .78rem var(--mono);color:#fff;flex:none;align-self:center}
.k-class{background:#7c3aed}.k-function{background:#2563eb}.k-method{background:#0e7490}.k-table{background:#b45309}.k-type{background:#be185d}.k-const{background:#4b5563}.k-value{background:#0f766e}.k-other{background:#4b5563}
.nm{font-weight:700;font-family:var(--mono);font-size:.95rem}
.sig{font-family:var(--mono);font-size:.83rem;color:var(--muted);word-break:break-word}
.ln{font:.78rem var(--mono);color:var(--muted);margin-left:auto}
.ln a{color:var(--accent)}
.prose code,.note code,.tagline code,.purpose code,.purpose-big code,.role code,.small code,.problem code,.role-item code,.hit code,.warnlist code,.story code,.pcard code,.step code,.guide code{background:var(--surface2);font-family:var(--mono);font-size:.88em;border-radius:4px;padding:0 3px}
.note{margin:2px 0 0 2.15rem;font-size:.94rem;max-width:72ch}
.note.none{color:var(--muted);font-style:italic;font-size:.82rem;opacity:.85}
.calls{margin:3px 0 0 2.15rem;font-size:.84rem;color:var(--muted)}
.calls a{font-family:var(--mono);cursor:pointer;margin-right:6px}
.priv{font-size:.7rem;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 5px}
ul.methods{margin:4px 0 0 2.15rem !important;border-left:2px solid var(--border);padding-left:.9rem !important}
.consts{display:flex;flex-wrap:wrap;gap:6px}
.consts code,.names code,.libs code{background:var(--surface2);border-radius:5px;padding:1px 7px}
.imp{display:grid;gap:8px}
.imp-i{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.names{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;font-size:.84rem}
.libs{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--muted);font-style:italic}
.warnlist{list-style:none;padding:0;margin:1rem 0;display:grid;gap:8px;max-width:90ch}
.warnlist li{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:10px;padding:8px 14px;word-break:break-word}
.warnlist a{font-family:var(--mono);font-size:.9em;text-decoration:underline}
.miss{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);border-radius:5px;font-size:.74rem;padding:0 7px;font-weight:600}

@media (max-width:820px){
  main{padding:20px 14px 50px}
  .row{grid-template-columns:1.7rem minmax(0,1fr) 5.6rem}
  .row .purpose{grid-column:2/-1;grid-row:2}
  .row .lines{grid-row:1;grid-column:3}
  .searchbox{order:5;flex:1 1 100%}
  .spacer{display:none}
  .map svg{max-height:340px}
  .pn>span{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" id="brand" href="#/">RepoTour</a>
    <nav class="main" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/stories" data-nav="stories">Stories</a>
      <a href="#/parts" data-nav="parts">Parts</a>
      <a href="#/files" data-nav="files">All files</a>
    </nav>
    <span class="spacer"></span>
    <div class="searchbox" role="search">
      <input id="gsearch" type="search" placeholder="Search files, functions, notes" aria-label="Search" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
      <div class="dropdown" id="dd" hidden></div>
    </div>
    <a class="iconbtn" id="warnbtn" href="#/warnings" hidden aria-label="Warnings">Warnings <span class="badge" id="warncount">0</span></a>
    <button class="iconbtn" id="theme" type="button" aria-label="Toggle light and dark theme">Theme</button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer id="foot"></footer>

const DATA = {"tool": {"name": "RepoTour", "version": "0.1.0", "url": "https://github.com/tejeshkinariwala/repotour"}, "mode": "written", "project": {"name": "Requests", "tagline": "A Python library that sends HTTP requests and returns the server's response as a Python object.", "overview": "Calling `requests.get(url)` builds a request, sends it over a pooled urllib3 connection and returns a `Response`. The same steps run when you use a `Session`, which also keeps cookies and default settings between calls. Most of the code is one pipeline. `api.py` and `sessions.py` take the call, `models.py` turns it into a `PreparedRequest`, `adapters.py` sends it and builds the `Response`, and `sessions.py` follows redirects. `auth.py`, `cookies.py` and `utils.py` support each stage.", "repo_url": "https://github.com/psf/requests", "branch": "main"}, "built_at": "2026-09-29 12:54 +08:00", "stats": {"files": 51, "lines": 12645, "languages": {"python": 37, "yaml": 12, "ini": 1, "toml": 1}}, "roles": [{"id": "conductor", "emoji": "🎬", "name": "Conductor", "meaning": "Starts things and calls other files in order: entry points, CLIs, servers, scripts, build steps."}, {"id": "rulebook", "emoji": "📐", "name": "Rulebook", "meaning": "Defines what things must look like: types, schemas, interfaces, base classes, constants, registries. Does little work itself."}, {"id": "worker", "emoji": "⚙️", "name": "Worker", "meaning": "Does the actual work: the core logic, algorithms and transformations."}, {"id": "guard", "emoji": "🛡️", "name": "Guard", "meaning": "Checks something and refuses or stops when it is wrong: validation, auth, permissions, limits."}, {"id": "storekeeper", "emoji": "📦", "name": "Storekeeper", "meaning": "Saves and loads data: databases, caches, files, queues, migrations."}, {"id": "courier", "emoji": "🔌", "name": "Courier", "meaning": "Talks to the outside world: HTTP clients, API adapters, SDK wrappers, messaging."}, {"id": "analyst", "emoji": "🔍", "name": "Analyst", "meaning": "Measures and reports: metrics, logging, statistics, reports, charts."}, {"id": "face", "emoji": "🖼️", "name": "Face", "meaning": "What a user sees: UI components, pages, views, templates, styles."}, {"id": "config", "emoji": "🗂️", "name": "Settings", "meaning": "A file of settings or records that code reads."}, {"id": "helper", "emoji": "🧩", "name": "Helper", "meaning": "Small shared utilities and package markers."}, {"id": "test", "emoji": "🧪", "name": "Test", "meaning": "Automated test that checks other files still behave as before."}], "parts": [{"id": "entry", "name": "Public entry points", "role": "The names a user imports and the checks that run on import", "summary": "`api.py` holds the one-call functions such as `requests.get`. `__init__.py` re-exports the public names and checks the versions of urllib3 and the character-detection library when the package is imported. `packages.py` keeps the old `requests.packages.*` import paths working, and `help.py` prints version details for bug reports.", "folders": ["src/requests/api.py/", "src/requests/__init__.py/", "src/requests/__version__.py/", "src/requests/packages.py/", "src/requests/help.py/"], "color": "#3b82f6", "problems": ["E1", "E2", "E3", "E4"], "files": 7, "lines": 608}, {"id": "session", "name": "Sessions and redirects", "role": "Runs a request from start to finish and follows redirects", "summary": "`Session` merges its own settings with each call, prepares the request, picks an adapter, sends the request and follows redirects. `hooks.py` runs user callbacks on each response.", "folders": ["src/requests/sessions.py/", "src/requests/hooks.py/"], "color": "#10b981", "problems": ["S1", "S2"], "files": 4, "lines": 4084}, {"id": "messages", "name": "Requests, responses and errors", "role": "The objects that describe a request, a response and what can go wrong", "summary": "`models.py` defines `Request`, `PreparedRequest` and `Response`. `PreparedRequest` turns URL, params, headers, body, cookies and auth into the exact values that are sent. `Response` reads the body and decodes it. `exceptions.py` defines every error the library raises. `structures.py` holds the case-insensitive header dictionary. `_types.py` holds type hints.", "folders": ["src/requests/models.py/", "src/requests/exceptions.py/", "src/requests/status_codes.py/", "src/requests/structures.py/", "src/requests/_types.py/"], "color": "#f59e0b", "problems": ["M1", "M2", "M3", "M4", "M5"], "files": 6, "lines": 1883}, {"id": "transport", "name": "Transport", "role": "Sends a prepared request over the network and returns a response", "summary": "`HTTPAdapter` uses urllib3 connection pools to send requests, applies TLS verification and proxy settings, converts urllib3 errors into requests exceptions and builds the `Response`. `certs.py` names the default CA bundle file.", "folders": ["src/requests/adapters.py/", "src/requests/certs.py/"], "color": "#ef4444", "problems": ["T1", "T2"], "files": 4, "lines": 1202}, {"id": "authstate", "name": "Authentication and cookies", "role": "Adds credentials to requests and keeps cookies between requests", "summary": "`auth.py` has the Basic, Proxy and Digest authentication handlers. `cookies.py` adapts the standard library cookie jar so it works with requests and responses from this library, and gives the jar a dict-like interface.", "folders": ["src/requests/auth.py/", "src/requests/cookies.py/"], "color": "#8b5cf6", "problems": ["A1", "A2"], "files": 2, "lines": 979}, {"id": "support", "name": "Helpers and compatibility", "role": "Small functions and import shims used by every other part", "summary": "`utils.py` holds parsing, proxy, encoding and URL helpers. `compat.py` picks the JSON library, the character-detection library and the standard library names the rest of the code imports. `_internal_utils.py` holds two string helpers that depend only on `compat.py`.", "folders": ["src/requests/utils.py/", "src/requests/_internal_utils.py/", "src/requests/compat.py/"], "color": "#ec4899", "problems": ["U1", "U2", "U3"], "files": 4, "lines": 2334}, {"id": "project", "name": "Tests, CI, docs and packaging", "role": "Everything outside `src/requests` that builds, tests and documents the library", "summary": "Tests use pytest with a local socket server and a `httpbin` fixture. GitHub Actions run tests, lint, type checks and security scans. Packaging is in `pyproject.toml`, and Sphinx builds the documentation from `docs/`.", "folders": ["tests/", ".github/", "docs/", "pyproject.toml/", "setup.py/", "tox.ini/", ".pre-commit-config.yaml/", ".readthedocs.yaml/"], "color": "#14b8a6", "problems": ["P1", "P2", "P3"], "files": 24, "lines": 1555}], "part_links": [{"from": "entry", "to": "session", "imports": 2}, {"from": "entry", "to": "messages", "imports": 5}, {"from": "entry", "to": "support", "imports": 2}, {"from": "session", "to": "entry", "imports": 1}, {"from": "session", "to": "messages", "imports": 10}, {"from": "session", "to": "transport", "imports": 2}, {"from": "session", "to": "authstate", "imports": 4}, {"from": "session", "to": "support", "imports": 4}, {"from": "session", "to": "project", "imports": 4}, {"from": "messages", "to": "session", "imports": 1}, {"from": "messages", "to": "transport", "imports": 1}, {"from": "messages", "to": "authstate", "imports": 4}, {"from": "messages", "to": "support", "imports": 5}, {"from": "transport", "to": "entry", "imports": 1}, {"from": "transport", "to": "messages", "imports": 4}, {"from": "transport", "to": "authstate", "imports": 2}, {"from": "transport", "to": "support", "imports": 3}, {"from": "transport", "to": "project", "imports": 2}, {"from": "authstate", "to": "messages", "imports": 3}, {"from": "authstate", "to": "support", "imports": 5}, {"from": "support", "to": "entry", "imports": 1}, {"from": "support", "to": "messages", "imports": 5}, {"from": "support", "to": "transport", "imports": 1}, {"from": "support", "to": "authstate", "imports": 2}, {"from": "support", "to": "project", "imports": 1}, {"from": "project", "to": "entry", "imports": 2}, {"from": "project", "to": "support", "imports": 1}], "problems": [{"id": "E1", "part": "entry", "title": "A user wants to send one request without creating a session", "without": "Every script would have to create a `Session`, call it and close it, so a simple GET would take several lines and sockets would stay open unless the caller closed them.", "fix": "`api.py` defines `get`, `post`, `put`, `patch`, `delete`, `head`, `options` and `request`. `request` opens a `Session` in a `with` block, calls `Session.request` and closes the session on exit.", "files": ["src/requests/api.py"], "tests": [], "placeholder": false}, {"id": "E2", "part": "entry", "title": "Importing the package must report incompatible dependencies and expose the public names", "without": "A wrong urllib3 or chardet version would fail later with an obscure error, and users would have to import each class from its own module.", "fix": "`__init__.py` runs `check_compatibility` on import, emits a `RequestsDependencyWarning` when versions are outside the supported range, and re-exports `get`, `Session`, `Response`, `codes` and the main exceptions. `__version__.py` holds the version and metadata.", "files": ["src/requests/__init__.py", "src/requests/__version__.py"], "tests": [], "placeholder": false}, {"id": "E3", "part": "entry", "title": "Old code imports urllib3 and idna through requests.packages", "without": "Code written for older versions that does `from requests.packages import urllib3` would raise `ImportError`.", "fix": "`packages.py` imports `urllib3`, `idna` and the detected character library, then registers each of their modules in `sys.modules` under a `requests.packages.` name so both names refer to the same module object.", "files": ["src/requests/packages.py"], "tests": ["tests/test_packages.py"], "placeholder": false}, {"id": "E4", "part": "entry", "title": "A bug report needs the versions of Python, TLS and dependencies", "without": "Maintainers would have to ask each reporter for their platform, OpenSSL and library versions by hand.", "fix": "`help.py` builds a dictionary of those versions in `info` and prints it as JSON when run with `python -m requests.help`.", "files": ["src/requests/help.py"], "tests": ["tests/test_help.py"], "placeholder": false}, {"id": "S1", "part": "session", "title": "Settings, cookies and connections must carry over from one request to the next", "without": "Each call would need the same headers, auth, proxies and cookies passed again, and every call would open a new connection.", "fix": "`Session` in `sessions.py` holds default headers, auth, params, proxies, hooks, `verify`, `cert`, a cookie jar and a map of adapters. `Session.request` builds a `Request`, `prepare_request` merges session and per-call values with `merge_setting`, and `send` picks an adapter and sends. `resolve_redirects` in `SessionRedirectMixin` follows redirects.", "files": ["src/requests/sessions.py"], "tests": ["tests/test_requests.py"], "placeholder": false}, {"id": "S2", "part": "session", "title": "A user wants to run code on each response", "without": "Logging, timing or rewriting a response would need a wrapper around every call.", "fix": "`hooks.py` keeps the list of event names (only `response` exists) and `dispatch_hook` calls each registered function with the response. A hook that returns a value replaces the response.", "files": ["src/requests/hooks.py"], "tests": ["tests/test_hooks.py"], "placeholder": false}, {"id": "M1", "part": "messages", "title": "Python arguments must become the exact URL, headers and body that go on the wire", "without": "Each caller would have to encode query strings, form data, JSON and multipart files by hand and set `Content-Length` and `Content-Type`.", "fix": "`Request` in `models.py` holds what the user passed. `PreparedRequest` runs `prepare_method`, `prepare_url`, `prepare_headers`, `prepare_cookies`, `prepare_body`, `prepare_auth` and `prepare_hooks`. `Response` holds the status, headers and body and decodes the body on request.", "files": ["src/requests/models.py"], "tests": [], "placeholder": false}, {"id": "M2", "part": "messages", "title": "Callers need to tell different failures apart", "without": "Every failure would raise the same error, so code could not retry a timeout differently from a bad URL.", "fix": "`exceptions.py` defines `RequestException` and a subclass for each failure: connection, timeout, SSL, bad URL, too many redirects, bad JSON and others. It also defines the warnings the library emits.", "files": ["src/requests/exceptions.py"], "tests": [], "placeholder": false}, {"id": "M3", "part": "messages", "title": "Status codes are hard to read as bare numbers", "without": "Code would compare against literals such as 307 with no name to explain them.", "fix": "`status_codes.py` fills a `LookupDict` called `codes` with names such as `codes.ok` and `codes.temporary_redirect`, in lower and upper case.", "files": ["src/requests/status_codes.py"], "tests": [], "placeholder": false}, {"id": "M4", "part": "messages", "title": "Header names arrive in any capitalisation", "without": "`headers['content-type']` would fail when the server sent `Content-Type`.", "fix": "`structures.py` defines `CaseInsensitiveDict`, which stores each key in lower case for lookup and keeps the original spelling for display. `LookupDict` gives dictionary values attribute access for `codes`.", "files": ["src/requests/structures.py"], "tests": ["tests/test_structures.py"], "placeholder": false}, {"id": "M5", "part": "messages", "title": "Type checkers need names for the many accepted argument shapes", "without": "Each signature would repeat long unions for data, params, files and auth.", "fix": "`_types.py` defines type aliases and `TypedDict` classes for keyword arguments, and two small runtime helpers, `has_read` and `is_prepared`. It is internal.", "files": ["src/requests/_types.py"], "tests": [], "placeholder": false}, {"id": "T1", "part": "transport", "title": "A prepared request must be sent over a reused, verified connection", "without": "Every request would open a new TCP and TLS connection, and proxy, certificate and timeout settings would have to be applied by the caller.", "fix": "`HTTPAdapter` in `adapters.py` keeps a urllib3 `PoolManager`. `send` gets a connection, verifies TLS, sends the request and builds the `Response`. It converts urllib3 exceptions into requests exceptions. `BaseAdapter` defines the interface for custom adapters.", "files": ["src/requests/adapters.py"], "tests": ["tests/test_adapters.py", "tests/test_lowlevel.py"], "placeholder": false}, {"id": "T2", "part": "transport", "title": "HTTPS needs a default set of trusted certificate authorities", "without": "Every HTTPS call would fail verification unless the caller supplied a CA file.", "fix": "`certs.py` returns the path of the `certifi` bundle from `where()`. `utils.py` stores it as `DEFAULT_CA_BUNDLE_PATH`.", "files": ["src/requests/certs.py"], "tests": [], "placeholder": false}, {"id": "A1", "part": "authstate", "title": "A server asks for a username and password", "without": "Callers would compute the `Authorization` header themselves, including the Digest challenge and response.", "fix": "`auth.py` defines `HTTPBasicAuth`, `HTTPProxyAuth` and `HTTPDigestAuth`. Basic sets a header. Digest registers a response hook that answers a 401 challenge and resends the request.", "files": ["src/requests/auth.py"], "tests": [], "placeholder": false}, {"id": "A2", "part": "authstate", "title": "Cookies from a response must be sent back on later requests", "without": "Login sessions would not work, because the cookie set by the server would be dropped after each response.", "fix": "`cookies.py` wraps requests and responses in `MockRequest` and `MockResponse` so `http.cookiejar` can read them. `RequestsCookieJar` adds dict-like access. `extract_cookies_to_jar` stores cookies and `get_cookie_header` builds the `Cookie` header.", "files": ["src/requests/cookies.py"], "tests": [], "placeholder": false}, {"id": "U1", "part": "support", "title": "The same small conversions are needed in many places", "without": "Header parsing, proxy matching, URL re-quoting and encoding detection would be copied into each module that needs them.", "fix": "`utils.py` holds these as separate functions. `models.py`, `sessions.py`, `adapters.py`, `auth.py` and `cookies.py` import them.", "files": ["src/requests/utils.py"], "tests": ["tests/test_utils.py"], "placeholder": false}, {"id": "U2", "part": "support", "title": "Low-level string checks are needed without circular imports", "without": "`models.py` and `auth.py` would need to import `utils.py` for two tiny functions and header regexes, which imports `models.py` back.", "fix": "`_internal_utils.py` holds `to_native_string`, `unicode_is_ascii` and the header validation regexes, and imports only `compat.py`.", "files": ["src/requests/_internal_utils.py"], "tests": [], "placeholder": false}, {"id": "U3", "part": "support", "title": "The library must run with different JSON and character-detection packages", "without": "Each module would need its own try/except imports for `simplejson`, `chardet` and `charset_normalizer`.", "fix": "`compat.py` chooses `simplejson` if installed, otherwise `json`, and chooses `chardet` or `charset_normalizer`. It re-exports standard library names and keeps Python 2 flags (`is_py2`, `is_py3`) and aliases for old callers.", "files": ["src/requests/compat.py"], "tests": [], "placeholder": false}, {"id": "P1", "part": "project", "title": "Tests need a local server and shared fixtures", "without": "Low-level tests such as chunked uploads or bad responses would depend on the internet or on a real server that cannot be made to misbehave.", "fix": "`tests/testserver/server.py` defines `Server` and `TLSServer`, threads that accept a socket and run a handler function. `tests/conftest.py` clears proxy environment variables before every test and wraps the `httpbin` fixtures.", "files": ["tests/conftest.py", "tests/testserver/__init__.py", "tests/testserver/server.py", "tests/utils.py", "tests/compat.py", "tests/__init__.py"], "tests": ["tests/test_testserver.py"], "placeholder": false}, {"id": "P2", "part": "project", "title": "Every change must be tested, linted and scanned before merge", "without": "A change could break a Python version, an operating system, type checking or the release process without anyone seeing it.", "fix": "Workflows in `.github/workflows/` run tests on several Python versions and operating systems, lint through `pre-commit`, run `pyright`, run CodeQL and `zizmor`, close and lock issues, and publish to PyPI on a `v*` tag. `tox.ini` runs the tests locally. `dependabot.yml` updates action and hook versions.", "files": [".github/workflows/close-issues.yml", ".github/workflows/codeql-analysis.yml", ".github/workflows/lint.yml", ".github/workflows/lock-issues.yml", ".github/workflows/publish.yml", ".github/workflows/run-tests.yml", ".github/workflows/typecheck.yml", ".github/workflows/zizmor.yml", ".github/dependabot.yml", ".pre-commit-config.yaml", "tox.ini"], "tests": [], "placeholder": false}, {"id": "P3", "part": "project", "title": "The library must be installable and documented", "without": "There would be no package metadata to install from and no published documentation.", "fix": "`pyproject.toml` defines the package, dependencies, ruff, pytest and pyright settings. `setup.py` stops installation on Python older than 3.10. `docs/conf.py` configures Sphinx and `.readthedocs.yaml` builds it.", "files": ["pyproject.toml", "setup.py", ".readthedocs.yaml", "docs/conf.py", "docs/_themes/flask_theme_support.py", ".github/FUNDING.yml"], "tests": [], "placeholder": false}], "stories": [{"id": "S1", "act": "Act 1: Send a request", "title": "A script calls requests.get and reads the response", "command": "python -c \"import requests; print(requests.get('https://httpbin.org/get').json())\"", "summary": "The call builds a request, prepares it, sends it through an adapter and returns a `Response` whose body is already read.", "steps": [{"text": "`requests.get` calls `request('get', ...)`. `request` opens a `Session` in a `with` block and calls `Session.request`.", "files": ["src/requests/api.py"]}, {"text": "`Session.request` builds a `Request` and calls `prepare_request`, which merges cookies, headers, params and auth from the session and the call. If neither has auth and `trust_env` is on, it looks up netrc credentials.", "files": ["src/requests/sessions.py", "src/requests/utils.py"]}, {"text": "`PreparedRequest.prepare` runs method, URL, headers, cookies, body, auth and hooks in that order. `prepare_url` checks the scheme and host and encodes params. `prepare_cookies` sets the `Cookie` header.", "files": ["src/requests/models.py", "src/requests/cookies.py"]}, {"text": "`merge_environment_settings` adds proxies from environment variables and a CA bundle from `REQUESTS_CA_BUNDLE` or `CURL_CA_BUNDLE`. `Session.send` then picks the adapter whose prefix matches the URL.", "files": ["src/requests/sessions.py"]}, {"text": "`HTTPAdapter.send` gets a pooled connection, checks the certificate settings, builds the timeout and calls urllib3's `urlopen`. `build_response` wraps the result in a `Response` and stores its cookies.", "files": ["src/requests/adapters.py", "src/requests/cookies.py"]}, {"text": "Back in `Session.send`, the response hooks run, cookies are saved to the session jar and redirects are resolved. Unless `stream` is set, it reads `r.content` before returning.", "files": ["src/requests/sessions.py", "src/requests/hooks.py", "src/requests/models.py"]}]}, {"id": "S2", "act": "Act 1: Send a request", "title": "The server answers with a redirect", "command": "python -c \"import requests; r = requests.get('https://httpbin.org/redirect/2'); print(r.history)\"", "summary": "`resolve_redirects` rebuilds the request for each hop until a response is not a redirect, or raises after too many.", "steps": [{"text": "`Session.send` calls `resolve_redirects` when `allow_redirects` is true. `get_redirect_target` reads the `Location` header if `Response.is_redirect` is true.", "files": ["src/requests/sessions.py", "src/requests/models.py"]}, {"text": "Each hop reads and closes the previous response, raises `TooManyRedirects` after `max_redirects` (30 by default), and joins a relative `Location` to the current URL with `requote_uri`.", "files": ["src/requests/sessions.py", "src/requests/utils.py", "src/requests/exceptions.py"]}, {"text": "`rebuild_method` changes the method to GET for 303 and 302 (unless the method is HEAD) and for POST after 301. For anything other than 307 or 308 the body and its headers are dropped.", "files": ["src/requests/sessions.py"]}, {"text": "`rebuild_auth` removes `Authorization` when `should_strip_auth` says the host, scheme or port changed. `rebuild_proxies` recomputes proxies for the new URL. If the body is a file, `rewind_body` moves it back to its start.", "files": ["src/requests/sessions.py", "src/requests/utils.py"]}, {"text": "The new request is sent with `allow_redirects=False`, so each hop is handled by this loop, and the responses are stored in `history`.", "files": ["src/requests/sessions.py", "src/requests/adapters.py"]}]}, {"id": "S3", "act": "Act 1: Send a request", "title": "A script posts JSON, then a file", "command": "python -c \"import requests; requests.post('https://httpbin.org/post', json={'a': 1}); requests.post('https://httpbin.org/post', files={'f': open('x.txt', 'rb')})\"", "summary": "`prepare_body` picks the body format from the arguments and sets the `Content-Type` and `Content-Length` headers.", "steps": [{"text": "`Session.request` passes `data`, `files` and `json` to `Request`, and `PreparedRequest.prepare` passes them to `prepare_body`.", "files": ["src/requests/sessions.py", "src/requests/models.py"]}, {"text": "With `json` and no `data`, `prepare_body` serialises it with `dumps(..., allow_nan=False)`, encodes it as UTF-8 and sets `Content-Type: application/json`. NaN raises `InvalidJSONError`.", "files": ["src/requests/models.py", "src/requests/compat.py"]}, {"text": "With `files`, `_encode_files` reads each file (guessing the file name with `guess_filename`) and builds a multipart body with urllib3. Streamed bodies and `files` together raise `NotImplementedError`.", "files": ["src/requests/models.py", "src/requests/utils.py"]}, {"text": "For bytes, strings and form data, `prepare_content_length` uses `super_len` to set `Content-Length`. For a file or generator body, `prepare_body` itself sets `Content-Length` if `super_len` finds a length and `Transfer-Encoding: chunked` if not.", "files": ["src/requests/models.py", "src/requests/utils.py"]}]}, {"id": "S4", "act": "Act 2: Failures and streaming", "title": "A request fails because the server is unreachable or answers 4xx or 5xx", "command": "python -c \"import requests; requests.get('http://localhost:1/', timeout=1)\"", "summary": "Network failures are raised as requests exceptions by the adapter. Error status codes raise only when the caller asks with `raise_for_status`.", "steps": [{"text": "`HTTPAdapter.send` catches urllib3 errors. A connect timeout becomes `ConnectTimeout`, a proxy error `ProxyError`, an SSL error `SSLError`, a read timeout `ReadTimeout`, and other connection failures `ConnectionError`.", "files": ["src/requests/adapters.py", "src/requests/exceptions.py"]}, {"text": "All of them derive from `RequestException`, which stores the `request` and `response` given to it.", "files": ["src/requests/exceptions.py"]}, {"text": "A response with status 404 or 500 is returned normally. `Response.raise_for_status` raises `HTTPError` for 400-499 and 500-599. `Response.ok` calls it and returns False if it raised.", "files": ["src/requests/models.py", "src/requests/exceptions.py"]}]}, {"id": "S5", "act": "Act 2: Failures and streaming", "title": "A script downloads a large file in chunks", "command": "python -c \"import requests; r = requests.get(url, stream=True); [len(c) for c in r.iter_content(8192)]\"", "summary": "With `stream=True` the body is not read in `Session.send`. `iter_content` reads it when the caller asks.", "steps": [{"text": "`Session.send` skips the `r.content` read when `stream` is true, so the adapter's urllib3 response stays open.", "files": ["src/requests/sessions.py", "src/requests/adapters.py"]}, {"text": "`Response.iter_content` reads from `raw.stream` in chunks and turns urllib3 decoding, protocol, timeout and SSL errors into `ChunkedEncodingError`, `ContentDecodingError`, `ConnectionError` and `SSLError`.", "files": ["src/requests/models.py", "src/requests/exceptions.py"]}, {"text": "With `decode_unicode=True`, `stream_decode_response_unicode` decodes each chunk using `Response.encoding`. If a caller reads the stream a second time, `StreamConsumedError` is raised.", "files": ["src/requests/utils.py", "src/requests/models.py"]}]}, {"id": "S6", "act": "Act 2: Failures and streaming", "title": "A request goes through an HTTP proxy from an environment variable", "command": "HTTPS_PROXY=http://user:pw@proxy.example:3128 python -c \"import requests; requests.get('https://httpbin.org/get')\"", "summary": "Proxy settings come from the environment and the call, and the adapter connects through a proxy manager when one matches.", "steps": [{"text": "`merge_environment_settings` calls `get_environ_proxies`, which returns nothing when `should_bypass_proxies` matches `no_proxy`. Otherwise it returns the standard library's `getproxies()`.", "files": ["src/requests/sessions.py", "src/requests/utils.py"]}, {"text": "`Session.send` calls `resolve_proxies` when the call did not pass proxies. `HTTPAdapter.get_connection_with_tls_context` then uses `select_proxy` to choose a proxy by scheme and host, or `all`.", "files": ["src/requests/sessions.py", "src/requests/adapters.py", "src/requests/utils.py"]}, {"text": "`get_connection_with_tls_context` calls `proxy_manager_for`. For a `socks` proxy it uses `SOCKSProxyManager`, otherwise it uses `proxy_from_url` with a `Proxy-Authorization` header built by `proxy_headers` from the credentials in the URL.", "files": ["src/requests/adapters.py", "src/requests/auth.py", "src/requests/utils.py"]}, {"text": "`request_url` sends the full URL (without credentials or fragment) for an HTTP request through a non-SOCKS proxy, and only the path otherwise.", "files": ["src/requests/adapters.py", "src/requests/utils.py"]}]}, {"id": "S7", "act": "Act 3: Authentication and extension", "title": "A script authenticates with HTTP Digest", "command": "python -c \"import requests; from requests.auth import HTTPDigestAuth; requests.get(url, auth=HTTPDigestAuth('user', 'pw'))\"", "summary": "The first request goes out without credentials. A response hook reads the 401 challenge and resends the request with a Digest header.", "steps": [{"text": "`PreparedRequest.prepare_auth` calls the auth object. A `(user, pass)` tuple is first wrapped in `HTTPBasicAuth`.", "files": ["src/requests/models.py", "src/requests/auth.py"]}, {"text": "`HTTPDigestAuth.__call__` resets per-thread state, adds a Digest header only if it already has a nonce from an earlier response, remembers the body position and registers `handle_401` and `handle_redirect` as response hooks.", "files": ["src/requests/auth.py"]}, {"text": "After sending, `Session.send` calls `dispatch_hook`, which calls `handle_401`.", "files": ["src/requests/sessions.py", "src/requests/hooks.py"]}, {"text": "If the status is 400-499, `WWW-Authenticate` names digest and fewer than two attempts were made, `handle_401` parses the challenge with `parse_dict_header`, calls `build_digest_header`, copies the request, adds the header and sends it again with `r.connection.send`.", "files": ["src/requests/auth.py", "src/requests/utils.py", "src/requests/adapters.py"]}]}, {"id": "S8", "act": "Act 3: Authentication and extension", "title": "A developer mounts a custom transport adapter", "command": "python -c \"import requests; s = requests.Session(); s.mount('https://', requests.adapters.HTTPAdapter(max_retries=3))\"", "summary": "`Session.mount` maps a URL prefix to an adapter. `get_adapter` picks the adapter for each request.", "steps": [{"text": "`Session.__init__` mounts an `HTTPAdapter` for `https://` and `http://`. `mount` stores an adapter under a prefix and re-orders the map so longer prefixes are checked first.", "files": ["src/requests/sessions.py"]}, {"text": "`HTTPAdapter(max_retries=3)` turns the integer into a urllib3 `Retry` with `Retry.from_int`. With the default of 0 it uses `Retry(0, read=False)`, so nothing is retried.", "files": ["src/requests/adapters.py"]}, {"text": "`Session.get_adapter` returns the first adapter whose prefix starts the URL, or raises `InvalidSchema`. A subclass of `BaseAdapter` only has to implement `send` and `close`.", "files": ["src/requests/sessions.py", "src/requests/adapters.py"]}]}, {"id": "S9", "act": "Act 3: Authentication and extension", "title": "A contributor writes a test against a misbehaving server", "command": "pytest tests/test_lowlevel.py", "summary": "A test starts a `Server` with a handler function that writes raw bytes, then calls `requests` against it.", "steps": [{"text": "`Server` is a thread that binds to a free port, accepts the given number of connections and passes each socket to its handler. It is a context manager that yields `(host, port)`.", "files": ["tests/testserver/server.py"]}, {"text": "The test writes a handler that sends a fixed byte string (for example an incomplete chunked response), enters the server and calls `requests.get` on its URL.", "files": ["tests/test_lowlevel.py", "tests/testserver/server.py"]}, {"text": "The library sees a normal socket. The assertion checks the exception or the request the handler received, for example `ChunkedEncodingError`.", "files": ["tests/test_lowlevel.py", "src/requests/adapters.py", "src/requests/models.py"]}]}], "guide": [{"text": "Start with the map. The library is one pipeline plus support code.", "story": null, "part": null}, {"text": "the main path, from `requests.get` to a `Response`. Every other story is a variation of it.", "story": "S1", "part": null}, {"text": "the functions and names a user imports.", "story": null, "part": "entry"}, {"text": "where settings are merged and redirects are followed.", "story": null, "part": "session"}, {"text": "how arguments become a request and how a response is read.", "story": null, "part": "messages"}, {"text": "the code that touches urllib3 and the network.", "story": null, "part": "transport"}, {"text": "how redirects change the request.", "story": "S2", "part": null}, {"text": "which exceptions are raised for which failures.", "story": "S4", "part": null}, {"text": "credentials and cookies.", "story": null, "part": "authstate"}, {"text": "helpers used by all of the above.", "story": null, "part": "support"}, {"text": "how the tests are written, if you are contributing.", "story": "S9", "part": null}], "files": {".github/FUNDING.yml": {"lang": "yaml", "lines": 1, "purpose": "Lists the Python Software Foundation sponsorship link that GitHub shows on the Sponsor button.", "role": "config", "problem": "P3", "part": "project", "stories": [], "imports": [], "libs": [], "used_by": []}, ".github/dependabot.yml": {"lang": "yaml", "lines": 30, "purpose": "Configures Dependabot to open weekly update pull requests for GitHub Actions and pre-commit hooks, skipping patch releases.", "role": "config", "problem": "P2", "part": "project", "stories": [], "imports": [], "libs": [], "used_by": []}, ".github/workflows/close-issues.yml": {"lang": "yaml", "lines": 38, "purpose": "Workflow that closes and locks issues that carry the autoclose labels, with a comment pointing question askers elsewhere.", "role": "config", "problem": "P2", "part": "project", "stories": [], "imports function mapSvg() {

  let h = `<div class="map">`;

    const W = 780, H = parts.length === 1 ? 160 : parts.length <= 3 ? 280 : 350, nw = 168, nh = 58;
    const cx = W / 2, cy = H / 2, rx = W / 2 - nw / 2 - 30, ry = H / 2 - nh / 2 - 26;
    const pos = {};

      const s = clipPt(a, c), e = clipPt(b, c);

      const lx = 0.25 * s.x + 0.5 * c.x + 0.25 * e.x, ly = 0.25 * s.y + 0.5 * c.y + 0.25 * e.y;
      const nameA = (D.partById[l.from] || {}).name, nameB = (D.partById[l.to] || {}).name;
      edges += `<g><title>${esc(nameA)} imports from ${esc(nameB)}: ${num(l.imports)} file-to-file imports</title>` +
        `<path class="edge" d="M${s.x.toFixed(1)},${s.y.toFixed(1)} Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${e.x.toFixed(1)},${e.y.toFixed(1)}" stroke-width="${w.toFixed(1)}" marker-end="url(#ah)"/>` +
        `<text class="elabel" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle">${num(l.imports)}</text></g>`;
    });
    let nodes = "";
    parts.forEach(p => {
      const q = pos[p.id];
      nodes += `<a href="${partHref(p.id)}" class="node" style="--pc:${esc(p.color)}"><rect x="${(q.x - nw / 2).toFixed(1)}" y="${(q.y - nh / 2).toFixed(1)}" width="${nw}" height="${nh}" rx="10"/>` +
        `<text x="${q.x.toFixed(1)}" y="${(q.y - 3).toFixed(1)}" text-anchor="middle">${esc(clip(p.name, 20))}</text>` +
        `<text class="sub" x="${q.x.toFixed(1)}" y="${(q.y + 15).toFixed(1)}" text-anchor="middle">${plural(p.files, "file")} &middot; ${fmt(p.lines)} lines</text></a>`;
    });

      `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>` +
      edges + nodes + `</svg>`;
  }
  if (links.length) {
    h += `<div style="padding:6px 12px 10px"><div class="sub-h" style="margin-top:4px">Which part uses which <span style="text-transform:none;letter-spacing:0;font-weight:400">(arrow points to the part being used; number = files importing files)</span></div><ul class="deps">` +
      links.slice().sort((a, b) => num(b.imports) - num(a.imports)).map(l =>

/* ---- search index ---- */
let IDX = null;
function outlineNames(items, acc) {
  arr(items).forEach(it => {
    it = obj(it);
    acc.push(str(it.name), str(it.signature), noTicks(it.note));
    arr(it.methods).forEach(m => acc.push(str(obj(m).name), noTicks(obj(m).note)));
    outlineNames(it.children, acc);
  });
  return acc;
}
function buildIndex() {
  if (IDX) return IDX;
  IDX = D.paths.map(p => {
    const f = F(p);
    const names = outlineNames(obj(f.outline).items, []);
    return {p, s: (p + " " + noTicks(f.purpose) + " " + names.join(" ")).toLowerCase(), n: names.map(x => x.toLowerCase())};

  for (const it of items) {

  h += `<div class="fhead"><h1 class="fpath">${esc(path)}</h1>${srcUrl ? `<a href="${esc(srcUrl)}" target="_blank" rel="noopener noreferrer">view source &#8599;</a>` : ""}</div>`;
  h += `<div class="meta">${rolePill(str(f.role))}` +
    (part ? `<a class="pill" href="${partHref(part.id)}"><span class="swatch" style="--pc:${esc(part.color)}"></span>${esc(part.name)}</a>` : "") +
    (prob ? `<a class="pill" href="${partHref(prob.part)}#p-${esc(prob.id)}" data-problem="${esc(prob.id)}"><b>${esc(prob.id)}</b> ${pr(clip(prob.title, 60))}</a>` : "") +
    `<span class="pill muted">${esc(str(f.lang) || "text")} &middot; ${fmt(f.lines)} lines</span></div>`;
  if (f.purpose) h += `<p class="purpose-big">${pr(f.purpose)}</p>`;
  const stories = arr(f.stories).filter(id => D.storyById[id]);
  if (stories.length) h += `<div class="meta"><span class="small muted">Used in stories:</span>` + stories.map(id => `<a class="pill" href="${storyHref(id)}">${esc(D.storyById[id].title)}</a>`).join("") + `</div>`;

  h += `<h2>Inside the file</h2>`;
  const ol = f.outline && typeof f.outline === "object" ? f.outline : null;
  const items = ol ? arr(ol.items) : [];
  if (!ol) h += `<p class="empty">No outline is available for this kind of file.</p>`;
  else {
    const ids = {}; let n = 0;
    (function reg(list) { list.forEach(it => { it = obj(it); const k = str(it.name); if (k && !(k in ids)) ids[k] = "it-" + (++n); reg(arr(it.children)); }); })(items);
    const missing = countMissing(items);
    if (missing && D.mode === "written") h += `<p><span class="miss">notes missing</span> <span class="small muted">${plural(missing, "item")} in this file ${missing === 1 ? "has" : "have"} no note.</span></p>`;
    if (!items.length) h += `<p class="empty">Nothing to outline: no top-level functions or classes.</p>`;
    else h += `<ul class="outline">${items.map(it => itemHtml(it, path, ids, false)).join("")}</ul>`;
    const consts = arr(ol.consts);
    if (consts.length) h += `<div class="sub-h">Constants</div><div class="consts">${consts.map(c => `<code>${esc(c)}</code>`).join("")}</div>`;
  }

  h += `<h2>Imports</h2><p class="muted small" style="margin-top:-.4rem">Other files in this repo that this file uses.</p>`;
  const imps = arr(f.imports).map(obj).filter(i => i.file);
  h += imps.length ? `<div class="imp">` + imps.map(i => {
    const nm = arr(i.names);
    return `<div class="imp-i">${fileInline(i.file)}${nm.length ? `<div class="names">${nm.map(x => `<code>${esc(x)}</code>`).join("")}</div>` : ""}</div>`;
  }).join("") + `</div>` : `<p class="empty">Imports no other file in this repo.</p>`;

  h += `<h2>Libraries</h2>`;
  const libs = arr(f.libs);
  h += libs.length ? `<div class="libs">${libs.map(l => `<code>${esc(l)}</code>`).join("")}</div>` : `<p class="empty">No outside libraries.</p>`;

  h += `<h2>Used by</h2>`;
  const ub = strs(f.used_by);
  h += ub.length ? rowsBlock(ub, 150) : `<p class="empty">No other file imports this one.</p>`;
  return h;
}
function fileInline(p) {
  const f = F(p);
  return `<a href="${fileHref(p)}"><span title="${esc(f ? roleName(f.role) : "")}">${esc(f ? roleEmoji(f.role) : "?")}</span> <span class="mono">${esc(p)}</span></a>` +
    (f && f.purpose ? ` <span class="muted small">${pr(clip(f.purpose, 110))}</span>` : "");
}
function countMissing(items) {
  let c = 0;
  arr(items).forEach(it => { it = obj(it); if (!str(it.note).trim()) c++; arr(it.methods).forEach(m => { if (!str(obj(m).note).trim()) c++; }); c += countMissing(it.children); });
  return c;
}
function lineLink(path, line) {
  if (!line) return "";
  const u = sourceUrl(path, line);
  return `<span class="ln">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="View source at line ${esc(line)}">L${esc(line)}</a>` : "L" + esc(line)}</span>`;
}
function itemHtml(it, path, ids, isChild) {
  it = obj(it);
  const kind = str(it.kind) || "function";
  const kcls = ["class", "function", "method", "table", "type", "const", "value"].includes(kind) ? kind : "other";
  const glyph = {class: "C", function: "ƒ", method: "m", table: "▦", type: "T", const: "=", value: "v"}[kind] || kind.charAt(0).toUpperCase();
  const id = ids[str(it.name)];
  const sig = str(it.signature) && str(it.signature) !== str(it.name) ? `<code class="sig">${esc(it.signature)}</code>` : "";
  let h = `<li class="item" ${id ? `id="${id}"` : ""}><div class="irow"><span class="kind k-${kcls}" title="${esc(kind)}" aria-label="${esc(kind)}">${esc(glyph)}</span><span class="nm">${esc(it.name)}</span>${sig}` +
    (it.exported === false ? `<span class="priv" title="Not part of the public interface">private</span>` : "") + lineLink(path, it.line) + `</div>`;
  h += noteHtml(it.note);
  const calls = arr(it.calls).map(str).filter(Boolean);
  if (calls.length) h += `<div class="calls">calls &rarr; ` + calls.map(c => ids[c] ? `<a data-goto="${ids[c]}" role="link" tabindex="0">${esc(c)}</a>` : `<code>${esc(c)}</code>`).join(" ") + `</div>`;
  const methods = arr(it.methods).map(obj);
  if (methods.length) h += `<ul class="methods">` + methods.map(m =>
    `<li class="item"><div class="irow"><span class="kind k-method" title="method" aria-label="method">m</span><span class="nm">${esc(m.name)}</span>` +
    (str(m.signature) && m.signature !== m.name ? `<code class="sig">${esc(m.signature)}</code>` : "") + lineLink(path, m.line) + `</div>${noteHtml(m.note)}</li>`).join("") + `</ul>`;
  const kids = arr(it.children);
  if (kids.length) h += `<ul>` + kids.map(k => itemHtml(k, path, ids, true)).join("") + `</ul>`;
  return h + `</li>`;
}
function noteHtml(n) {
  n = str(n).trim();
  if (n) return `<div class="note">${pr(n)}</div>`;
  return D.mode === "written" ? `<div class="note none">no note yet</div>` : "";
}

function viewWarnings() {
  const paths = new Set(D.paths);
  let h = `<h1>Warnings</h1>`;
  if (!D.warnings.length) return h + `<p class="empty">No warnings. Everything in the written tour matches the code.</p>`;
  h += `<p class="muted prose">The tour and the code disagree in these places. Fix them in <code>.repotour/</code> and build again.</p><ul class="warnlist">` +
    D.warnings.map(w => `<li>${pr(w).replace(/[^\s'"(),:;]+/g, tok => { const raw = tok.replace(/&amp;/g, "&"); return paths.has(raw) ? `<a href="${fileHref(raw)}">${tok}</a>` : tok; })}</li>`).join("") + `</ul>`;
  return h;
}
function notFound(kind, id) {
  return `<h1>Not found</h1><p>There is no ${esc(kind)} called <code>${esc(id)}</code> in this tour.</p><p><a href="#/">Back to the home page</a></p>`;
}

/* ---------- router ---------- */
function parseHash() {
  let h = location.hash.replace(/^#/, "");
  if (h.charAt(0) !== "/") h = "/" + h;
  let query = "";
  const qi = h.indexOf("?");
  if (qi >= 0) { query = h.slice(qi + 1); h = h.slice(0, qi); }
  // a #p-<id> anchor after a part route
  const ai = h.indexOf("#");
  let anchor = "";
  if (ai >= 0) { anchor = h.slice(ai + 1); h = h.slice(0, ai); }
  const segs = h.split("/").filter((s, i) => i > 0 || s !== "");
  const dec = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
  return {name: dec(segs[0] || ""), arg: segs.slice(1).map(dec).join("/"), query: new URLSearchParams(query), anchor};
}
let lastKey = "";
function render() {
  const r = parseHash();
  const app = $("#main");
  let html, title = D.project.name, nav = "home";
  try {
    switch (r.name) {
      case "part": html = viewPart(r.arg); nav = "parts"; title = (D.partById[r.arg] || {}).name || "Part"; break;
      case "parts": html = viewParts(); nav = "parts"; title = "Parts"; break;
      case "story": html = viewStory(r.arg); nav = "stories"; title = (D.storyById[r.arg] || {}).title || "Story"; break;
      case "stories": html = viewStories(); nav = "stories"; title = "Stories"; break;
      case "file": html = viewFile(r.arg); nav = "files"; title = r.arg.split("/").pop(); break;
      case "files": html = viewFiles(r.query); nav = "files"; title = "All files"; break;
      case "warnings": html = viewWarnings(); nav = ""; title = "Warnings"; break;
      default: html = viewHome();
    }
  } catch (e) {
    console.error(e);
    html = `<h1>Something went wrong</h1><p>This view could not be drawn: <code>${esc(e && e.message)}</code></p>`;
  }
  app.innerHTML = html;
  document.title = (title === D.project.name ? title : title + " · " + D.project.name);
  document.querySelectorAll("nav.main a").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (r.name === "files") updateFilesResults();
  const key = r.name + "/" + r.arg;
  if (r.anchor && $("#" + CSS.escape(r.anchor))) { $("#" + CSS.escape(r.anchor)).scrollIntoView(); }
  else if (key !== lastKey || r.name !== "files") window.scrollTo(0, 0);
  lastKey = key;
  closeDd();
}
window.addEventListener("hashchange", render);

/* ---------- events ---------- */
function flash(id) {
  const el = document.getElementById(id); if (!el) return;
  el.scrollIntoView({block: "center", behavior: "smooth"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1800);
}
function copyText(t, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
}
$("#main").addEventListener("click", e => {
  const t = e.target.closest("[data-goto],[data-copy],[data-more],[data-chip]");
  if (!t) return;
  if (t.dataset.goto) { e.preventDefault(); flash(t.dataset.goto); }
  else if (t.dataset.copy != null) copyText(t.dataset.copy, t);
  else if (t.dataset.more) {
    const m = MORE[t.dataset.more]; if (!m) return;
    const wrap = document.createElement("div"); wrap.innerHTML = m.paths.map(p => fileRow(p, m.opts)).join("");
    const parent = t.parentNode; parent.removeChild(t);
    while (wrap.firstChild) parent.appendChild(wrap.firstChild);
    delete MORE[t.dataset.more];
  } else if (t.dataset.chip) {
    const k = t.dataset.chip, v = t.dataset.val;
    FS[k] = FS[k] === v ? "" : v;
    history.replaceState(null, "", filesQuery());
    document.querySelectorAll('[data-chip="' + k + '"]').forEach(b => b.setAttribute("aria-pressed", String(FS[k] === b.dataset.val)));
    updateFilesResults();
  }
});
$("#main").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.goto) { e.preventDefault(); flash(e.target.dataset.goto); }
});
$("#main").addEventListener("input", e => {
  if (e.target.id !== "fq") return;
  clearTimeout(fqTimer);
  fqTimer = setTimeout(() => { FS.q = e.target.value; history.replaceState(null, "", filesQuery()); updateFilesResults(); }, 120);
});
let fqTimer = 0;
$("#main").addEventListener("toggle", e => {
  const d = e.target;
  if (!d.dataset || !d.dataset.tree || !d.open) return;
  const t = TREE[d.dataset.tree];
  if (t && !t.built) { t.built = true; d.querySelector(".inner").innerHTML = folderBody(d.dataset.tree); }
}, true);

/* global search */
const gs = $("#gsearch"), dd = $("#dd");
let ddItems = [], ddSel = -1, gsTimer = 0;
function closeDd() { dd.hidden = true; ddSel = -1; }
function updateDd() {
  const words = matchWords(gs.value);
  if (!words.length) { closeDd(); return; }
  const hit = s => words.every(w => s.toLowerCase().includes(w));
  let h = "";
  const ps = D.parts.filter(p => hit(p.name + " " + p.role)).slice(0, 3);
  const ss = D.stories.filter(s => hit(s.title + " " + s.summary)).slice(0, 3);
  const fs = buildIndex().filter(e => words.every(w => e.s.includes(w))).slice(0, 8);
  const total = buildIndex().filter(e => words.every(w => e.s.includes(w))).length;
  if (ps.length) h += `<div class="dd-h">Parts</div>` + ps.map(p => `<a class="dd-i" href="${partHref(p.id)}">${esc(p.name)}<span class="muted">${esc(clip(p.role, 50))}</span></a>`).join("");
  if (ss.length) h += `<div class="dd-h">Stories</div>` + ss.map(s => `<a class="dd-i" href="${storyHref(s.id)}">${esc(s.title)}</a>`).join("");
  if (fs.length) h += `<div class="dd-h">Files</div>` + fs.map(e => `<a class="dd-i" href="${fileHref(e.p)}">${esc(roleEmoji(F(e.p).role))} <span class="mono">${esc(e.p)}</span></a>`).join("");
  h += `<a class="dd-i" href="#/files?q=${encodeURIComponent(gs.value.trim())}"><b>See all ${fmt(total)} matching files</b></a>`;
  dd.innerHTML = h; dd.hidden = false;
  ddItems = [...dd.querySelectorAll(".dd-i")]; ddSel = -1;
}
gs.addEventListener("input", () => { clearTimeout(gsTimer); gsTimer = setTimeout(updateDd, 100); });
gs.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (dd.hidden) return;
    e.preventDefault();
    ddSel = (ddSel + (e.key === "ArrowDown" ? 1 : -1) + ddItems.length) % ddItems.length;
    ddItems.forEach((a, i) => a.classList.toggle("sel", i === ddSel));
    ddItems[ddSel].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (ddSel >= 0 && ddItems[ddSel]) location.hash = ddItems[ddSel].getAttribute("href");
    else if (gs.value.trim()) location.hash = "#/files?q=" + encodeURIComponent(gs.value.trim());
    closeDd();
  }
});
document.addEventListener("click", e => { if (!e.target.closest(".searchbox")) closeDd(); });
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
  if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); gs.focus(); gs.select(); }
  else if (e.key === "Escape") {
    if (gs.value || document.activeElement === gs) { gs.value = ""; closeDd(); gs.blur(); }
    else if (document.activeElement && document.activeElement.id === "fq") { const q = document.activeElement; q.value = ""; FS.q = ""; history.replaceState(null, "", filesQuery()); updateFilesResults(); }
  }
});

/* theme */
const root = document.documentElement;
function setTheme(t, save) {
  root.setAttribute("data-theme", t);
  const b = $("#theme"); b.textContent = t === "dark" ? "☀ Light" : "☾ Dark";
  b.setAttribute("aria-pressed", String(t === "dark"));
  if (save) { try { localStorage.setItem("repotour-theme", t); } catch (e) { /* file:// may block */ } }
}
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem("repotour-theme"); } catch (e) { /* ignore */ }
  if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  setTheme(t, false);
})();
$("#theme").addEventListener("click", () => setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true));

/* chrome */
(function initChrome() {
  $("#brand").textContent = D.project.name;
  if (D.warnings.length) { $("#warnbtn").hidden = false; $("#warncount").textContent = D.warnings.length; $("#warnbtn").setAttribute("aria-label", D.warnings.length + " warnings"); }
  const t = D.tool, when = D.built_at ? " on " + esc(D.built_at) : "";
  const name = /^https?:\/\//i.test(str(t.url)) ? `<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.name)}</a>` : esc(t.name);
  $("#foot").innerHTML = `Built with ${name}${t.version ? " v" + esc(t.version) : ""}${when}.`;
  if (!DATA) $("#main").innerHTML = `<h1>No data</h1><p>This is the empty template. Build a tour with <code>repotour build</code>.</p>`;
})();
if (DATA) render();
</script>
