.github/workflows/lint.yml:
  _file: "Workflow that runs pre-commit on every push and pull request."
.github/workflows/lock-issues.yml:
  _file: "Workflow that locks issues and pull requests after 90 days of inactivity, run daily."
.github/workflows/publish.yml:
  _file: "Workflow that builds the distributions and publishes them to PyPI when a version tag is pushed, or to Test PyPI on manual runs."
.github/workflows/run-tests.yml:
  _file: "Workflow that runs the test suite on several Python versions and operating systems."
.github/workflows/typecheck.yml:
  _file: "Workflow that runs the type checker on the oldest and newest supported Python versions."
.pre-commit-config.yaml:
  _file: "Pre-commit hooks: basic file checks plus ruff linting and formatting."
pyproject.toml:
  _file: "Project metadata, dependencies, setuptools build settings and ruff configuration."
setup.py:
  _file: "Stops with an error on Python older than 3.10, then calls setuptools setup(), which reads pyproject.toml."
tox.ini:
  _file: "tox environments that run pytest on each supported Python version, with and without chardet."
