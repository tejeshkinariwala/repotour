<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoTour</title>
<style>
:root{
  --bg:#f6f6f3; --surface:#ffffff; --surface2:#f0f0ec; --text:#1c2230; --muted:#59616f; --border:#dcdcd5;
  --accent:#2350c8; --accent-bg:#e8eefc; --warn:#8a5300; --warn-bg:#fff3d6; --warn-border:#e8c777;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 2px 8px rgba(20,25,40,.04);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#13161c; --surface:#1b1f27; --surface2:#242933; --text:#e6e9ef; --muted:#a3abb8; --border:#2f3541;
  --accent:#86aaff; --accent-bg:#232f4d; --warn:#f3c56b; --warn-bg:#3a2e14; --warn-border:#6b5320;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:.88em}
h1{font-size:2rem;line-height:1.2;margin:0 0 .4rem;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:2.4rem 0 .8rem;letter-spacing:-.005em}
h3{font-size:1.05rem;margin:0 0 .4rem}
p{margin:.6rem 0}
.prose{max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--surface);padding:6px 10px;z-index:100}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main a{color:var(--muted);padding:6px 10px;border-radius:6px;font-size:.94rem}
nav.main a:hover{background:var(--surface2);text-decoration:none;color:var(--text)}
nav.main a[aria-current=page]{color:var(--accent);background:var(--accent-bg);font-weight:600}
.spacer{flex:1}
.searchbox{position:relative;min-width:200px;flex:0 1 300px}
.searchbox input{width:100%;padding:7px 34px 7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:.92rem}
.searchbox kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:.75rem var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 5px;pointer-events:none}
.dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-height:70vh;overflow:auto;z-index:30;min-width:340px}
.dropdown[hidden]{display:none}
.dd-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 12px 2px}
.dd-i{display:block;padding:6px 12px;color:var(--text);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-i:hover,.dd-i.sel{background:var(--accent-bg);text-decoration:none}
.dd-i .muted{margin-left:6px;font-size:.82rem}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:var(--surface2)}
.badge{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);border-radius:999px;font-size:.75rem;font-weight:700;padding:0 7px;line-height:1.4}

main{max-width:1120px;margin:0 auto;padding:28px 20px 60px;outline:none;min-height:70vh}
footer{max-width:1120px;margin:0 auto;padding:18px 20px 40px;color:var(--muted);font-size:.86rem;border-top:1px solid var(--border)}

.tagline{font-size:1.15rem;color:var(--muted);margin:0 0 1rem;max-width:60ch}
.crumbs{font-size:.88rem;color:var(--muted);margin-bottom:.8rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:1.1rem 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow)}
.stat b{font-size:1.25rem;display:block;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.banner{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:1rem 0;max-width:80ch}
.banner code{background:var(--surface);padding:1px 6px;border-radius:4px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.pcard{border-top:5px solid var(--pc,var(--accent));display:block;color:var(--text)}
a.pcard:hover{text-decoration:none;border-color:var(--pc,var(--accent));transform:translateY(-1px)}
.pcard h3{margin:0 0 2px;font-size:1.1rem}
.pcard .role{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.pcard .nums{font-size:.82rem;color:var(--muted)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--pc,var(--accent));margin-right:6px}
.map{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:var(--shadow);margin-bottom:14px}
.map svg{width:100%;height:auto;display:block;max-height:440px}
.map .node rect{fill:var(--pc);fill-opacity:.16;stroke:var(--pc);stroke-width:2}
.map .node:hover rect{fill-opacity:.3}
.map .node text{fill:var(--text);font:600 14px var(--sans)}
.map .node text.sub{font:12px var(--sans);fill:var(--muted)}
.map .edge{fill:none;stroke:var(--muted);opacity:.75}
.map .elabel{font:600 11px var(--sans);fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.deps{margin:.4rem 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 18px;font-size:.92rem}
.deps li{padding:2px 0}
.arrow{color:var(--muted);margin:0 4px}

.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.role-item{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.role-item .em{font-size:1.4rem;line-height:1.3}
.role-item small{display:block;color:var(--muted);line-height:1.4}

.act{margin:1.2rem 0 .3rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.storylist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.storylist a.story{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text)}
.storylist a.story:hover{border-color:var(--accent);text-decoration:none}
.storylist .t{font-weight:600}
ol.guide{padding-left:1.4rem;max-width:70ch}
ol.guide li{margin:.5rem 0;padding-left:.3rem}

/* file rows */
.rows{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1.7rem minmax(0,1.3fr) minmax(0,2fr) 5.6rem;gap:2px 10px;align-items:baseline;padding:7px 12px;border-top:1px solid var(--border);color:var(--text)}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-bg);text-decoration:none}
.row .em{text-align:center}
.row .path{font-family:var(--mono);font-size:.84rem;word-break:break-all;color:var(--accent)}
.row .path .dir{color:var(--muted)}
.row .purpose{font-size:.9rem;color:var(--muted)}
.row .lines{text-align:right;font-size:.78rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.row .hit{grid-column:2/-1;font-size:.8rem;color:var(--muted)}
.more{display:block;width:100%;background:var(--surface2);border:0;border-top:1px solid var(--border);padding:8px;color:var(--accent);cursor:pointer;font:inherit;font-size:.9rem}
.tagbtn{display:inline-block;font-size:.72rem;background:var(--surface2);color:var(--muted);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle;font-weight:600}

/* part & problems */
.phead{border-left:8px solid var(--pc,var(--accent));padding-left:16px;margin-bottom:1rem}
.problem{margin:16px 0}
.pid{font:700 .78rem var(--mono);background:var(--pc-bg,var(--surface2));color:var(--text);border:1px solid var(--pc,var(--border));border-radius:5px;padding:1px 7px;margin-right:8px;vertical-align:middle}
.problem .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);margin-top:.9rem;display:block}
.problem .rows,.step .rows{margin-top:10px}
.sub-h{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:14px 0 6px}
.placeholder-note{font-size:.88rem;color:var(--muted);font-style:italic}

/* story */
.cmd{display:flex;align-items:stretch;gap:0;margin:1rem 0;max-width:min(80ch,100%)}
.cmd code{flex:1;min-width:0;background:#161a22;color:#e6e9ef;padding:10px 14px;border-radius:8px 0 0 8px;overflow-x:auto;white-space:pre;font-size:.9rem}
.cmd button{border:1px solid var(--border);border-left:0;background:var(--surface);color:var(--text);padding:0 14px;border-radius:0 8px 8px 0;cursor:pointer;font:inherit;font-size:.88rem}
.cmd button:hover{background:var(--surface2)}
ol.steps{list-style:none;padding:0;margin:1rem 0;counter-reset:s}
.step{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:12px;margin:18px 0}
.step .n{width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--surface);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
:root[data-theme=dark] .step .n{color:#0d1220}
.step p{margin:.2rem 0 0}
.pn{display:flex;justify-content:space-between;gap:14px;margin-top:2.4rem;flex-wrap:wrap}
.pn>span{flex:0 1 48%}
.pn a{display:block;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text)}
.pn a small{display:block;color:var(--muted)}
.pn a:hover{border-color:var(--accent);text-decoration:none}

/* all files */
.filters{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin:1rem 0;box-shadow:var(--shadow)}
.filters input[type=search]{width:100%;max-width:520px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.chiprow .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;width:4.6rem}
.chip{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:2px 11px;font:inherit;font-size:.84rem;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
:root[data-theme=dark] .chip[aria-pressed=true]{color:#0d1220}
.chip .c{opacity:.7;font-size:.78rem;margin-left:3px}
details.folder{margin:2px 0}
details.folder>summary{cursor:pointer;padding:5px 8px;border-radius:6px;font-family:var(--mono);font-size:.86rem;list-style:none;display:flex;gap:8px;align-items:baseline}
details.folder>summary::-webkit-details-marker{display:none}
details.folder>summary::before{content:"\25B8";color:var(--muted);display:inline-block;width:.9em;transition:transform .12s}
details.folder[open]>summary::before{transform:rotate(90deg)}
details.folder>summary:hover{background:var(--surface2)}
details.folder>summary .cnt{color:var(--muted);font-size:.78rem;font-family:var(--sans)}
details.folder>.inner{margin-left:14px;padding-left:12px;border-left:1px solid var(--border)}
.tree{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px}
.tree .rows{border:0;border-radius:6px}
.tree-files{margin:2px 0 6px}

/* file view */
.fhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.fpath{font:600 1.2rem var(--mono);word-break:break-all;margin:0}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:2px 12px;font-size:.88rem;color:var(--text)}
a.pill:hover{border-color:var(--accent);text-decoration:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:.8rem 0}
.purpose-big{font-size:1.1rem;max-width:70ch;margin:1rem 0}
.outline,.outline ul{list-style:none;margin:0;padding:0}
.outline{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 14px}
.outline ul{margin-left:1.2rem;padding-left:.9rem;border-left:2px solid var(--border)}
.item{padding:8px 6px;border-radius:8px;transition:background .3s}
.item+.item{border-top:1px dashed var(--border)}
.outline ul .item{border-top:0}
.item.flash{background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent)}
.irow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.kind{display:inline-flex;align-items:center;justify-content:center;min-width:1.5rem;height:1.5rem;border-radius:6px;font:700 .78rem var(--mono);color:#fff;flex:none;align-self:center}
.k-class{background:#7c3aed}.k-function{background:#2563eb}.k-method{background:#0e7490}.k-table{background:#b45309}.k-type{background:#be185d}.k-const{background:#4b5563}.k-value{background:#0f766e}.k-other{background:#4b5563}
.nm{font-weight:700;font-family:var(--mono);font-size:.95rem}
.sig{font-family:var(--mono);font-size:.83rem;color:var(--muted);word-break:break-word}
.ln{font:.78rem var(--mono);color:var(--muted);margin-left:auto}
.ln a{color:var(--accent)}
.prose code,.note code,.tagline code,.purpose code,.purpose-big code,.role code,.small code,.problem code,.role-item code,.hit code,.warnlist code,.story code,.pcard code,.step code,.guide code{background:var(--surface2);font-family:var(--mono);font-size:.88em;border-radius:4px;padding:0 3px}
.note{margin:2px 0 0 2.15rem;font-size:.94rem;max-width:72ch}
.note.none{color:var(--muted);font-style:italic;font-size:.82rem;opacity:.85}
.calls{margin:3px 0 0 2.15rem;font-size:.84rem;color:var(--muted)}
.calls a{font-family:var(--mono);cursor:pointer;margin-right:6px}
.priv{font-size:.7rem;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 5px}
ul.methods{margin:4px 0 0 2.15rem !important;border-left:2px solid var(--border);padding-left:.9rem !important}
.consts{display:flex;flex-wrap:wrap;gap:6px}
.consts code,.names code,.libs code{background:var(--surface2);border-radius:5px;padding:1px 7px}
.imp{display:grid;gap:8px}
.imp-i{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.names{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;font-size:.84rem}
.libs{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--muted);font-style:italic}
.warnlist{list-style:none;padding:0;margin:1rem 0;display:grid;gap:8px;max-width:90ch}
.warnlist li{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:10px;padding:8px 14px;word-break:break-word}
.warnlist a{font-family:var(--mono);font-size:.9em;text-decoration:underline}
.miss{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);border-radius:5px;font-size:.74rem;padding:0 7px;font-weight:600}

@media (max-width:820px){
  main{padding:20px 14px 50px}
  .row{grid-template-columns:1.7rem minmax(0,1fr) 5.6rem}
  .row .purpose{grid-column:2/-1;grid-row:2}
  .row .lines{grid-row:1;grid-column:3}
  .searchbox{order:5;flex:1 1 100%}
  .spacer{display:none}
  .map svg{max-height:340px}
  .pn>span{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" id="brand" href="#/">RepoTour</a>
    <nav class="main" aria-label="Main">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/stories" data-nav="stories">Stories</a>
      <a href="#/parts" data-nav="parts">Parts</a>
      <a href="#/files" data-nav="files">All files</a>
    </nav>
    <span class="spacer"></span>
    <div class="searchbox" role="search">
      <input id="gsearch" type="search" placeholder="Search files, functions, notes" aria-label="Search" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
      <div class="dropdown" id="dd" hidden></div>
    </div>
    <a class="iconbtn" id="warnbtn" href="#/warnings" hidden aria-label="Warnings">Warnings <span class="badge" id="warncount">0</span></a>
    <button class="iconbtn" id="theme" type="button" aria-label="Toggle light and dark theme">Theme</button>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer id="foot"></footer>

const DATA = {"tool": {"name": "RepoTour", "version": "0.1.0", "url": "https://github.com/tejeshkinariwala/repotour"}, "mode": "written", "project": {"name": "RepoTour", "tagline": "Turns a code repository into a single-file HTML tour with parts, problems, user stories and one-line notes on every function.", "overview": "RepoTour has two halves. The `repotour` command scans a repository, parses Python and JavaScript/TypeScript files, reads `.repotour/tour.yaml` and `.repotour/notes.yaml`, and writes `.repotour/tour.html`. A Claude Code skill (`/repotour`) writes those two YAML files by calling the command.\nThis tour covers the Python engine, its tests and the project tooling. The skill files, the HTML template, the README and other Markdown or HTML files are not in the scan (the default scan reads only files with known code and config suffixes), so they appear in the stories as text only.", "repo_url": "https://github.com/tejeshkinariwala/repotour", "branch": "main"}, "built_at": "2026-09-29 12:54 +08:00", "stats": {"files": 43, "lines": 4736, "languages": {"python": 39, "json": 2, "toml": 1, "yaml": 1}}, "roles": [{"id": "conductor", "emoji": "🎬", "name": "Conductor", "meaning": "Starts things and calls other files in order: entry points, CLIs, servers, scripts, build steps."}, {"id": "rulebook", "emoji": "📐", "name": "Rulebook", "meaning": "Defines what things must look like: types, schemas, interfaces, base classes, constants, registries. Does little work itself."}, {"id": "worker", "emoji": "⚙️", "name": "Worker", "meaning": "Does the actual work: the core logic, algorithms and transformations."}, {"id": "guard", "emoji": "🛡️", "name": "Guard", "meaning": "Checks something and refuses or stops when it is wrong: validation, auth, permissions, limits."}, {"id": "storekeeper", "emoji": "📦", "name": "Storekeeper", "meaning": "Saves and loads data: databases, caches, files, queues, migrations."}, {"id": "courier", "emoji": "🔌", "name": "Courier", "meaning": "Talks to the outside world: HTTP clients, API adapters, SDK wrappers, messaging."}, {"id": "analyst", "emoji": "🔍", "name": "Analyst", "meaning": "Measures and reports: metrics, logging, statistics, reports, charts."}, {"id": "face", "emoji": "🖼️", "name": "Face", "meaning": "What a user sees: UI components, pages, views, templates, styles."}, {"id": "config", "emoji": "🗂️", "name": "Settings", "meaning": "A file of settings or records that code reads."}, {"id": "helper", "emoji": "🧩", "name": "Helper", "meaning": "Small shared utilities and package markers."}, {"id": "test", "emoji": "🧪", "name": "Test", "meaning": "Automated test that checks other files still behave as before."}], "parts": [{"id": "cli", "name": "Command line", "role": "Turns command-line arguments into calls on the engine", "summary": "`repotour build`, `scan`, `check`, `init` and `install-skill` all start in `cli.py`. `init_cmd.py` writes starter YAML files and `install.py` copies the packaged skill. Each command returns an exit code: 0 ok, 1 warnings (under `--strict` or `check`), 2 error.", "folders": ["src/repotour/"], "color": "#3b82f6", "problems": ["C1", "C2", "C3"], "files": 6, "lines": 432}, {"id": "discover", "name": "File discovery", "role": "Decides which files are in the tour, what role each has, and which files import which", "summary": "`scan.py` lists files, `repo.py` parses each one and works out `used_by`, `roles.py` gives each file a role, and `globs.py` matches the path patterns used in `tour.yaml`.", "folders": [], "color": "#10b981", "problems": ["D1", "D2", "D3", "D4"], "files": 9, "lines": 754}, {"id": "analyzers", "name": "File analyzers", "role": "Reads one source file and returns its header, outline, imports and libraries", "summary": "One analyzer per language family, chosen by file suffix. Python uses the standard `ast` module. JavaScript and TypeScript use a small lexer plus regular expressions, because no third-party parser is used. Other text files get only a header comment and a line count.", "folders": ["src/repotour/analyzers/"], "color": "#f59e0b", "problems": ["A1", "A2", "A3", "A4"], "files": 14, "lines": 2186}, {"id": "content", "name": "Written content", "role": "Loads tour.yaml and notes.yaml, places files under problems, and attaches notes", "summary": "`config.py` reads the two YAML files and raises errors that stop the build. `layout.py` places every file under a part and a problem. `notes.py` attaches one-line notes to outline items and reports missing or stale notes.", "folders": [], "color": "#ef4444", "problems": ["T1", "T2", "T3"], "files": 3, "lines": 594}, {"id": "output", "name": "Data model and HTML", "role": "Builds the JSON data model and writes it into the HTML template", "summary": "`build.py` runs the whole pipeline and returns one dictionary. `render.py` puts that dictionary into `templates/tour.html` in place of a placeholder and writes the file.", "folders": [], "color": "#8b5cf6", "problems": ["B1", "B2"], "files": 4, "lines": 436}, {"id": "project", "name": "Packaging and tooling", "role": "Packaging metadata, CI and helper scripts for maintainers", "summary": "`pyproject.toml` defines the package and the `repotour` command. The plugin JSON files describe the skill for Claude Code. CI runs lint, tests and a check that the packaged skill copy matches `skills/repotour`. Scripts check for private terms, sync the skill copy and preview the template.", "folders": ["scripts/", ".github/", ".claude-plugin/"], "color": "#ec4899", "problems": ["P1", "P2", "P3"], "files": 7, "lines": 334}], "part_links": [{"from": "cli", "to": "discover", "imports": 3}, {"from": "cli", "to": "analyzers", "imports": 1}, {"from": "cli", "to": "content", "imports": 5}, {"from": "cli", "to": "output", "imports": 3}, {"from": "discover", "to": "cli", "imports": 1}, {"from": "discover", "to": "analyzers", "imports": 3}, {"from": "discover", "to": "content", "imports": 1}, {"from": "discover", "to": "output", "imports": 5}, {"from": "analyzers", "to": "cli", "imports": 1}, {"from": "analyzers", "to": "discover", "imports": 3}, {"from": "analyzers", "to": "content", "imports": 2}, {"from": "analyzers", "to": "output", "imports": 1}, {"from": "content", "to": "discover", "imports": 3}, {"from": "content", "to": "analyzers", "imports": 1}, {"from": "output", "to": "cli", "imports": 1}, {"from": "output", "to": "discover", "imports": 3}, {"from": "output", "to": "analyzers", "imports": 2}, {"from": "output", "to": "content", "imports": 4}], "problems": [{"id": "C1", "part": "cli", "title": "A user needs one command with several actions", "without": "Each action would be a separate script with its own argument handling and its own idea of what a failure is, and CI could not rely on exit codes.", "fix": "`cli.py` defines the sub-commands with `argparse`, runs the right engine functions, prints warnings to stderr and returns 0, 1 or 2. `__main__.py` lets `python -m repotour` do the same. `__init__.py` holds the version number that `--version` prints.", "files": ["src/repotour/cli.py", "src/repotour/__main__.py", "src/repotour/__init__.py"], "tests": ["tests/test_cli.py"], "placeholder": false}, {"id": "C2", "part": "cli", "title": "A new repo has no tour.yaml to start from", "without": "A user would have to write the YAML structure by hand and list every outline item to give it a note.", "fix": "`init_cmd.py` runs the scan, makes one part per top-level folder with a TODO problem for each, and writes a `notes.yaml` with an empty note for every outline item. It refuses to overwrite unless `--force` is given.", "files": ["src/repotour/init_cmd.py"], "tests": [], "placeholder": false}, {"id": "C3", "part": "cli", "title": "Claude Code cannot use the skill until its folder is in a .claude folder", "without": "Users would copy the skill folder from the package by hand and would not know where.", "fix": "`install.py` copies the skill folder shipped inside the package to `PROJECT/.claude/skills/repotour` or to `~/.claude/skills/repotour`. It refuses to touch an existing install unless `--force` is given, and then removes the old folder (or the link itself, not its target) first.", "files": ["src/repotour/install.py"], "tests": [], "placeholder": false}, {"id": "D1", "part": "discover", "title": "Which files belong in the tour?", "without": "The tour would include dependency folders, lock files, minified bundles, git-ignored files and files too big to parse.", "fix": "`scan.py` asks `git ls-files` when the folder has a `.git`, otherwise walks the folder. Folders such as `node_modules`, `.venv`, `__pycache__` and any `*_cache` are skipped at any depth in both cases. Outside git it also skips `build`, `dist`, `target`, `vendor`, `env` and `coverage`; in a git repo git decides about those. It then drops lock files, `.min.js` and `.map` files, symbolic links (with a warning), files over 1 MB (with a warning) and anything outside the suffix list or the `scan` patterns from `tour.yaml`.", "files": ["src/repotour/scan.py"], "tests": ["tests/test_scan.py", "tests/test_engine_fixes.py", "tests/test_security.py"], "placeholder": false}, {"id": "D2", "part": "discover", "title": "Every file must be parsed once and linked to the files that use it", "without": "Each later step would re-read and re-parse files, and no file could say which other files import it.", "fix": "`repo.py` parses each scanned file once, stores the facts, assigns roles and inverts the import lists into `used_by`.", "files": ["src/repotour/repo.py"], "tests": [], "placeholder": false}, {"id": "D3", "part": "discover", "title": "A reader wants to know what kind of job a file does", "without": "Every file would look the same in the tour, and the reader would have to open each one to tell an entry point from a test.", "fix": "`roles.py` holds the built-in roles and an ordered list of path rules; the first match wins and rules from `tour.yaml` are tried first.", "files": ["src/repotour/roles.py"], "tests": ["tests/test_roles.py"], "placeholder": false}, {"id": "D4", "part": "discover", "title": "Paths in tour.yaml are often patterns", "without": "A folder of similar files would have to be listed one file at a time.", "fix": "`globs.py` turns `*`, `?`, `[...]`, `**` and `{a,b}` patterns into regular expressions and matches whole repo-relative paths.", "files": ["src/repotour/globs.py"], "tests": ["tests/test_globs.py"], "placeholder": false}, {"id": "A1", "part": "analyzers", "title": "Every language must give the engine the same shape of facts", "without": "The engine would need separate code for each language, and every new language would change the engine.", "fix": "`base.py` defines `FileFacts`, `Item` and `Context`. `__init__.py` holds `LANGUAGES` (suffix to language name, which also gives the default scan suffixes) and maps a file suffix to an analyzer. `generic.py` handles every other text file and `headers.py` reads the leading comment used as the file purpose, skipping directives and license banners.", "files": ["src/repotour/analyzers/base.py", "src/repotour/analyzers/__init__.py", "src/repotour/analyzers/generic.py", "src/repotour/analyzers/headers.py"], "tests": ["tests/conftest.py", "tests/test_analyzers_fixes.py"], "placeholder": false}, {"id": "A2", "part": "analyzers", "title": "A Python file must be summarised without running it", "without": "Importing the file to inspect it would run its code, and the tour could not link imports to files.", "fix": "`python.py` parses the source with `ast`, lists functions, classes, methods and function tables (also inside `if` and `try` blocks, with overloads shown as their implementation), and resolves each import to a repo file or a library. The header skips reST titles, ASCII art and copyright fields.", "files": ["src/repotour/analyzers/python.py"], "tests": ["tests/test_python_analyzer.py"], "placeholder": false}, {"id": "A3", "part": "analyzers", "title": "JavaScript and TypeScript files need parsing with no parser installed", "without": "Comments and strings would be read as code, so a commented-out function or an import inside a string would show up in the outline.", "fix": "`jslex.py` blanks comments and literals, `jsoutline.py` finds declarations in the cleaned text (functions, classes, types, function tables and exported values, with multi-line signatures on one line), `jsresolve.py` resolves import paths (including `tsconfig.json` aliases, the nearest config, `extends` and `include`/`exclude`) and `javascript.py` runs the three.", "files": ["src/repotour/analyzers/javascript.py", "src/repotour/analyzers/jslex.py", "src/repotour/analyzers/jsoutline.py", "src/repotour/analyzers/jsresolve.py"], "tests": ["tests/test_javascript_analyzer.py"], "placeholder": false}, {"id": "A4", "part": "analyzers", "title": "Small helper functions clutter the outline", "without": "A file with many private helpers would list them all at the top level, and the reader could not tell which function uses which.", "fix": "`outline.py` nests a private helper under the one item that references it and fills each item's `calls` list. Both language analyzers use it.", "files": ["src/repotour/analyzers/outline.py"], "tests": [], "placeholder": false}, {"id": "T1", "part": "content", "title": "A mistake in the YAML must be reported with its location", "without": "A typo in an id would surface later as a crash or a blank page, with no hint about which key was wrong.", "fix": "`config.py` parses both files and raises `ConfigError` with the file, the key and the problem, for example `problems[0].part: unknown part 'nope'`. It also warns about empty recommended fields (part name and summary, problem title and fix, story title and steps) and part colours that are not plain colour values, which are replaced by the palette.", "files": ["src/repotour/config.py"], "tests": [], "placeholder": false}, {"id": "T2", "part": "content", "title": "Every file must sit under exactly one problem", "without": "Files could be missing from the tour or shown twice, and new files added after the tour was written would go unnoticed.", "fix": "`layout.py` expands the file patterns of each problem, warns about patterns that match nothing and files listed twice, and puts unlisted files under a \"Not yet placed\" problem in the part whose folder fits best. In auto mode it makes one placeholder problem per top-level folder.", "files": ["src/repotour/layout.py"], "tests": [], "placeholder": false}, {"id": "T3", "part": "content", "title": "Notes must stay in step with the code", "without": "A renamed function would keep its old note and a new function would have none, and nobody would be told.", "fix": "`notes.py` attaches each note to the outline item with the same key and warns about missing notes, notes for names that no longer exist, and notes for files that are missing or have no outline. When `tour.yaml` exists, `coverage_warnings` also warns about each non-test file that has outline items and no entry in `notes.yaml`.", "files": ["src/repotour/notes.py"], "tests": [], "placeholder": false}, {"id": "B1", "part": "output", "title": "The page needs all the facts in one object", "without": "The template would have to call the scanner, the analyzers and the YAML loader itself.", "fix": "`build.py` runs the pipeline and returns one dictionary with project, stats, parts, problems, stories, files and warnings. It also resolves story step patterns to files and counts imports between parts.", "files": ["src/repotour/build.py"], "tests": ["tests/test_build.py"], "placeholder": false}, {"id": "B2", "part": "output", "title": "The tour must open as one file with no server", "without": "The page would need a web server or several files kept next to each other.", "fix": "`render.py` loads `templates/tour.html`, replaces the `/*REPOTOUR_DATA*/null` placeholder with the JSON and writes the result. It writes every `\u003c` in the JSON as `\\u003c` so text in the data cannot end the script tag.", "files": ["src/repotour/render.py"], "tests": ["tests/test_template.py"], "placeholder": false}, {"id": "P1", "part": "project", "title": "The package and the skill must be installable", "without": "`pip install` would not create the `repotour` command or ship the template and the skill, and Claude Code could not find the plugin.", "fix": "`pyproject.toml` names the package, the dependency (PyYAML) and the `repotour` entry point. The two JSON files in `.claude-plugin/` describe the plugin and its marketplace entry.", "files": ["pyproject.toml", ".claude-plugin/marketplace.json", ".claude-plugin/plugin.json"], "tests": [], "placeholder": false}, {"id": "P2", "part": "project", "title": "Contributors need automatic checks", "without": "Lint errors, failing tests, an out-of-date packaged skill or a private term in a commit could reach the main branch.", "fix": "`ci.yml` runs ruff, the tests and `sync_skill.py --check` on four Python versions. `sync_skill.py` copies `skills/repotour` into the package. `leak_check.py` reports lines that contain terms from a private denylist and can install itself as a pre-commit hook.", "files": [".github/workflows/ci.yml", "scripts/sync_skill.py", "scripts/leak_check.py"], "tests": [], "placeholder": false}, {"id": "P3", "part": "project", "title": "The template is edited without running the engine", "without": "Every template change would need a full build of some repo to preview it.", "fix": "`preview_template.py` injects a saved data JSON file into the template and writes the HTML.", "files": ["scripts/preview_template.py"], "tests": [], "placeholder": false}], "stories": [{"id": "S1", "act": "Act 1: Build a tour", "title": "I build a tour of a repo that has no tour.yaml (auto mode)", "command": "repotour build .", "summary": "With no `.repotour/tour.yaml` the engine groups files by top-level folder, leaves the problem text empty and still writes a complete HTML page.", "steps": [{"text": "`main` parses the arguments and calls `_build`, which resolves the folder and calls `build_data`.", "files": ["src/repotour/cli.py"]}, {"text": "`load_config` finds no `tour.yaml`, so `config.tour` is `None`. It still reads `notes.yaml` if that exists.", "files": ["src/repotour/config.py"]}, {"text": "`collect_facts` calls `scan_files`, parses every file once, gives each a role and builds `used_by`.", "files": ["src/repotour/repo.py", "src/repotour/scan.py", "src/repotour/roles.py"]}, {"text": "`assemble` applies any notes (the no-entry coverage check runs only when `tour.yaml` exists), then calls `auto_layout`. It makes one part per top-level folder (looking through `src/`), one for root files and one for tests, each with one placeholder problem.", "files": ["src/repotour/build.py", "src/repotour/notes.py", "src/repotour/layout.py"]}, {"text": "`write_html` puts the data into the template and writes `.repotour/tour.html`. `_build` prints the warnings and a line with the file, line and warning counts.", "files": ["src/repotour/render.py", "src/repotour/cli.py"]}]}, {"id": "S2", "act": "Act 1: Build a tour", "title": "The skill writes the tour content", "command": "/repotour", "summary": "The skill is a Markdown file that tells Claude to call the CLI, read the code, write the two YAML files and loop on `repotour build` until there are no warnings. The skill files are not in this tour's scan.", "steps": [{"text": "The skill runs `repotour --version` and stops if the command is missing. The version comes from `__init__.py` through the `--version` flag.", "files": ["src/repotour/cli.py", "src/repotour/__init__.py"]}, {"text": "It runs `repotour scan ROOT --json`. `_scan` loads the config, collects facts, applies notes and prints `scan_json`: one entry per file with header, role, outline, imports, libs and `used_by`.", "files": ["src/repotour/cli.py", "src/repotour/repo.py", "src/repotour/notes.py"]}, {"text": "Claude reads the README, the entry points and any file whose header and outline are not enough, then writes `tour.yaml` and `notes.yaml`. This step is done by the model following `SKILL.md` and `reference/writing-guide.md`; no engine code runs.", "files": []}, {"text": "It runs `repotour build ROOT`. `load_config` parses the YAML and `written_layout` places files under the problems Claude wrote.", "files": ["src/repotour/config.py", "src/repotour/layout.py"]}, {"text": "Claude reads each warning printed to stderr, edits the YAML and builds again until the count is zero. It then offers `--open` and mentions `repotour check` for CI.", "files": ["src/repotour/cli.py", "src/repotour/notes.py"]}]}, {"id": "S3", "act": "Act 2: A file is parsed", "title": "A Python file is parsed", "command": "repotour scan . --json", "summary": "One Python file goes from text to header, outline, imports and libraries.", "steps": [{"text": "`scan_files` keeps the file if it is not in a skipped folder or a symbolic link, its suffix is in `DEFAULT_SUFFIXES` and no `exclude` pattern matches. `collect_facts` reads it with `read_text`.", "files": ["src/repotour/scan.py", "src/repotour/repo.py"]}, {"text": "`analyze_file` looks up the analyzer for `.py` in `REGISTRY` and calls `PythonAnalyzer.analyze`. If the analyzer raises, `_analyze` in `repo.py` records a warning and lists the file without an outline.", "files": ["src/repotour/analyzers/__init__.py", "src/repotour/repo.py"]}, {"text": "`ast.parse` reads the source. On a syntax error the file gets a warning and only a comment header.", "files": ["src/repotour/analyzers/python.py"]}, {"text": "The header is the first paragraph of the module docstring (after `_prose_lines` blanks reST titles, ASCII art and copyright fields), or the leading `#` comment block. `_outline` lists functions, classes with their methods, and dicts and lists that name functions (tables), found at top level or inside `if` and `try` blocks; `_collapse` keeps the first definition of a name and shows overloads by their implementation. Upper-case constants are recorded separately.", "files": ["src/repotour/analyzers/python.py", "src/repotour/analyzers/headers.py"]}, {"text": "`arrange` nests each private helper under the one item that uses it and fills `calls` for every item.", "files": ["src/repotour/analyzers/outline.py"]}, {"text": "`_collect_imports` resolves every `import` and `from ... import`, including relative ones and imports inside functions, to a repo file through `_find_module`. Anything else goes into `libs`, standard library included.", "files": ["src/repotour/analyzers/python.py", "src/repotour/analyzers/base.py"]}, {"text": "Back in `collect_facts`, the import lists are inverted to make `used_by`.", "files": ["src/repotour/repo.py"]}]}, {"id": "S4", "act": "Act 2: A file is parsed", "title": "A TypeScript file is parsed", "command": "repotour scan . --json", "summary": "The same result for a `.ts` or `.tsx` file, produced without a parser. This repo has no TypeScript files; the tests use a fixture app.", "steps": [{"text": "`REGISTRY` maps `.js`, `.jsx`, `.mjs`, `.cjs`, `.ts`, `.tsx`, `.mts` and `.cts` to `JavaScriptAnalyzer`.", "files": ["src/repotour/analyzers/__init__.py"]}, {"text": "`lex` returns a copy of the source with comments, strings, template text and regex literals replaced by spaces, so offsets and line numbers stay the same. It also keeps the text of each string by offset. The header comes from `slash_comment_header`, which skips directives such as `'use strict'`, tool comments and license banners.", "files": ["src/repotour/analyzers/jslex.py", "src/repotour/analyzers/headers.py"]}, {"text": "`Outliner.build` matches functions, classes, arrow functions, types, `export default` forms and export lists at bracket depth 0. A `const` holding an object or array becomes a table only if it names a function, and another exported value is listed as a value. Overloads are shown as their implementation and multi-line signatures are put on one line.", "files": ["src/repotour/analyzers/jsoutline.py", "src/repotour/analyzers/outline.py"]}, {"text": "`_collect_imports` runs regexes for `import ... from`, `export ... from`, side-effect imports, `import()` and `require()` on the cleaned text and reads the path from the saved strings.", "files": ["src/repotour/analyzers/javascript.py"]}, {"text": "`JsResolver.resolve` tries relative paths (also `.js` written for a `.ts` file, and `index` files), then `paths` and `baseUrl` from the nearest `tsconfig.json` or `jsconfig.json` (merged with one level of `extends`), if that config's `include` and `exclude` cover the importing file. Unresolved bare names go into `libs` through `library_name`.", "files": ["src/repotour/analyzers/jsresolve.py"]}, {"text": "`_only_reexports` marks a file that only re-exports, and `assign_role` gives such an `index.js` or `index.ts` the helper role.", "files": ["src/repotour/analyzers/javascript.py", "src/repotour/roles.py"]}]}, {"id": "S5", "act": "Act 3: Check and output", "title": "I check the tour for problems", "command": "repotour check", "summary": "Mistakes are either errors that stop the run (exit 2) or warnings that are counted (exit 1 from `check`, or from `build --strict`).", "steps": [{"text": "`config.py` raises `ConfigError` for YAML syntax errors, unknown part ids, unknown role ids, duplicate ids and guide items that name a missing story or part. `main` prints it as one line and returns 2. It only warns about empty recommended fields and part colours that are not plain.", "files": ["src/repotour/config.py", "src/repotour/cli.py"]}, {"text": "`layout.py` warns about patterns that match nothing, a file under two problems, a file under none, a part with no problems and a problem with no files.", "files": ["src/repotour/layout.py"]}, {"text": "`_stories` in `build.py` warns about story step paths that match nothing and about step files not under any problem.", "files": ["src/repotour/build.py"]}, {"text": "`apply_notes` warns about missing notes (once a file has any note), stale note names, and notes for files that are absent or not outlined. `coverage_warnings` warns about a non-test file with outline items and no entry at all; `assemble` runs it only when `tour.yaml` exists.", "files": ["src/repotour/notes.py"]}, {"text": "The scanner and analyzers add warnings for files over 1 MB, symbolic links, Python syntax errors and analyzer crashes.", "files": ["src/repotour/scan.py", "src/repotour/repo.py", "src/repotour/analyzers/python.py"]}, {"text": "`_check` prints each warning to stderr and returns 1 if there is any. `_build --strict` does the same after writing the HTML.", "files": ["src/repotour/cli.py"]}]}, {"id": "S6", "act": "Act 3: Check and output", "title": "The data becomes an HTML page", "command": "repotour build . --open", "summary": "The dictionary from `build_data` is written into the template as JSON.", "steps": [{"text": "`assemble` builds the dictionary: project text, statistics, parts with file and line counts, part-to-part import counts, problems, stories with resolved files, per-file records and warnings.", "files": ["src/repotour/build.py"]}, {"text": "`load_template` reads `templates/tour.html` from the installed package (or the file given with the hidden `--template` option).", "files": ["src/repotour/render.py"]}, {"text": "`render_html` raises `RenderError` if the placeholder is missing, then replaces it with the JSON, writing every `\u003c` as `\\u003c`.", "files": ["src/repotour/render.py"]}, {"text": "`write_html` creates the folder and writes the file. With `--open`, `_build` opens it in the default browser.", "files": ["src/repotour/render.py", "src/repotour/cli.py"]}, {"text": "To work on the template alone, `preview_template.py` does the same replacement with a saved JSON file.", "files": ["scripts/preview_template.py"]}]}, {"id": "S7", "act": "Act 4: Set up and extend", "title": "I install the skill", "command": "repotour install-skill --project .", "summary": "The skill folder inside the package is copied to a `.claude/skills` folder.", "steps": [{"text": "`_install_skill` chooses the target: the home folder for `--user`, otherwise the given project folder or the current folder, and passes `--force` on.", "files": ["src/repotour/cli.py"]}, {"text": "`install_skill` checks that the packaged `skill/SKILL.md` exists. If `.claude/skills/repotour` already exists it raises `InstallError` (exit 2) unless `--force` is given, in which case it removes the folder, or only the link if it is a symlink. It then copies the packaged files with `_copy_tree`, skipping `__pycache__`.", "files": ["src/repotour/install.py"]}, {"text": "The packaged copy comes from `skills/repotour`. `sync_skill.py` replaces the package copy, and CI runs it with `--check` to fail when the two differ. `pyproject.toml` includes the copy in the wheel.", "files": ["scripts/sync_skill.py", ".github/workflows/ci.yml", "pyproject.toml"]}]}, {"id": "S8", "act": "Act 4: Set up and extend", "title": "I start a tour by hand with init", "command": "repotour init", "summary": "`init` writes starter YAML files that build with no warnings but contain TODO text.", "steps": [{"text": "`init_project` refuses to run if either file exists, unless `--force`.", "files": ["src/repotour/init_cmd.py", "src/repotour/cli.py"]}, {"text": "It scans the repo with an empty config and uses `auto_parts` to make one part and one TODO problem per top-level folder.", "files": ["src/repotour/init_cmd.py", "src/repotour/layout.py"]}, {"text": "`_notes_skeleton` writes an empty note for every outline item, using `outline_keys` so the keys match what `apply_notes` expects.", "files": ["src/repotour/init_cmd.py", "src/repotour/notes.py"]}]}, {"id": "S9", "act": "Act 4: Set up and extend", "title": "I add support for another language", "command": "", "summary": "A new analyzer is one class plus an entry in `LANGUAGES` and a mapping in `REGISTRY`. The scanner's default suffix list is built from `LANGUAGES`.", "steps": [{"text": "Write a class with `analyze(path, text, ctx)` that returns `FileFacts`.", "files": ["src/repotour/analyzers/base.py"]}, {"text": "Add the suffixes to `LANGUAGES` in `__init__.py`. That gives each file a language name through `language_for` and adds the suffix to `DEFAULT_SUFFIXES`, so the scanner lists the files.", "files": ["src/repotour/analyzers/__init__.py", "src/repotour/scan.py"]}, {"text": "Map the suffixes to the new class in `REGISTRY`. The Python and JavaScript entries are built from `LANGUAGES`; a new language needs its own line, and suffixes left out fall back to `GenericAnalyzer`.", "files": ["src/repotour/analyzers/__init__.py"]}]}], "guide": [{"text": "Start with the map; the tour has six parts.", "story": null, "part": null}, {"text": "the main path. Everything else supports it.", "story": "S1", "part": null}, {"text": "how the skill uses the same commands.", "story": "S2", "part": null}, {"text": "what is read from each file, met in the parsing stories.", "story": null, "part": "analyzers"}, {"text": "a Python file from text to outline and imports.", "story": "S3", "part": null}, {"text": "the same for TypeScript, with a lexer instead of a parser.", "story": "S4", "part": null}, {"text": "how the written YAML is loaded, placed and checked.", "story": null, "part": "content"}, {"text": "which mistakes are errors and which are warnings.", "story": "S5", "part": null}, {"text": "how the data model becomes a page.", "story": null, "part": "output"}, {"text": "the last step of every build.", "story": "S6", "part": null}, {"text": "how the skill gets into Claude Code.", "story": "S7", "part": null}], "files": {".claude-plugin/marketplace.json": {"lang": "json", "lines": 16, "purpose": "Claude Code marketplace entry that lists the repotour plugin.", "role": "config", "problem": "P1", "part": "project", "stories": [], "imports": [], "libs": [], "used_by": []}, ".claude-plugin/plugin.json": {"lang": "json", "lines": 13, "purpose": "Claude Code plugin manifest: name, version, author, license and keywords.", "role": "c function mapSvg() {
  const parts = D.parts;

  const links = D.part_links.filter(l => ids.has(str(l.from)) && ids.has(str(l.to)) && l.from !== l.to && num(l.imports) > 0);
  let h = `<div class="map">`;

    const W = 780, H = parts.length === 1 ? 160 : parts.length <= 3 ? 280 : 350, nw = 168, nh = 58;
    const cx = W / 2, cy = H / 2, rx = W / 2 - nw / 2 - 30, ry = H / 2 - nh / 2 - 26;
    const pos = {};

      const s = clipPt(a, c), e = clipPt(b, c);
      const w = 1.5 + 4.5 * num(l.imports) / max;
      const lx = 0.25 * s.x + 0.5 * c.x + 0.25 * e.x, ly = 0.25 * s.y + 0.5 * c.y + 0.25 * e.y;
      const nameA = (D.partById[l.from] || {}).name, nameB = (D.partById[l.to] || {}).name;
      edges += `<g><title>${esc(nameA)} imports from ${esc(nameB)}: ${num(l.imports)} file-to-file imports</title>` +
        `<path class="edge" d="M${s.x.toFixed(1)},${s.y.toFixed(1)} Q${c.x.toFixed(1)},${c.y.toFixed(1)} ${e.x.toFixed(1)},${e.y.toFixed(1)}" stroke-width="${w.toFixed(1)}" marker-end="url(#ah)"/>` +
        `<text class="elabel" x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle">${num(l.imports)}</text></g>`;
    });
    let nodes = "";
    parts.forEach(p => {
      const q = pos[p.id];
      nodes += `<a href="${partHref(p.id)}" class="node" style="--pc:${esc(p.color)}"><rect x="${(q.x - nw / 2).toFixed(1)}" y="${(q.y - nh / 2).toFixed(1)}" width="${nw}" height="${nh}" rx="10"/>` +
        `<text x="${q.x.toFixed(1)}" y="${(q.y - 3).toFixed(1)}" text-anchor="middle">${esc(clip(p.name, 20))}</text>` +
        `<text class="sub" x="${q.x.toFixed(1)}" y="${(q.y + 15).toFixed(1)}" text-anchor="middle">${plural(p.files, "file")} &middot; ${fmt(p.lines)} lines</text></a>`;
    });
    h += `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagram of the parts and which parts import from which. Arrows point from the importing part to the part it uses.">` +
      `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>` +
      edges + nodes + `</svg>`;
  }
  if (links.length) {
    h += `<div style="padding:6px 12px 10px"><div class="sub-h" style="margin-top:4px">Which part uses which <span style="text-transform:none;letter-spacing:0;font-weight:400">(arrow points to the part being used; number = files importing files)</span></div><ul class="deps">` +
      links.slice().sort((a, b) => num(b.imports) - num(a.imports)).map(l =>
        `<li>${partLink(l.from)}<span class="arrow">&rarr;</span>${partLink(l.to)} <span class="muted small">${plural(num(l.imports), "import")}</span></li>`).join("") + `</ul></div>`;

  }

}

let IDX = null;
function outlineNames(items, acc) {

    it = obj(it);
    acc.push(str(it.name), str(it.signature), noTicks(it.note));
    arr(it.methods).forEach(m => acc.push(str(obj(m).name), noTicks(obj(m).note)));
    outlineNames(it.children, acc);

  return acc;
}
function buildIndex() {
  if (IDX) return IDX;
  IDX = D.paths.map(p => {
    const f = F(p);
    const names = outlineNames(obj(f.outline).items, []);
    return {p, s: (p + " " + noTicks(f.purpose) + " " + names.join(" ")).toLowerCase(), n: names.map(x => x.toLowerCase())};

    const missing = countMissing(items);
    if (missing && D.mode === "written") h += `<p><span class="miss">notes missing</span> <span class="small muted">${plural(missing, "item")} in this file ${missing === 1 ? "has" : "have"} no note.</span></p>`;
    if (!items.length) h += `<p class="empty">Nothing to outline: no top-level functions or classes.</p>`;
    else h += `<ul class="outline">${items.map(it => itemHtml(it, path, ids, false)).join("")}</ul>`;
    const consts = arr(ol.consts);
    if (consts.length) h += `<div class="sub-h">Constants</div><div class="consts">${consts.map(c => `<code>${esc(c)}</code>`).join("")}</div>`;
  }

  h += `<h2>Imports</h2><p class="muted small" style="margin-top:-.4rem">Other files in this repo that this file uses.</p>`;
  const imps = arr(f.imports).map(obj).filter(i => i.file);
  h += imps.length ? `<div class="imp">` + imps.map(i => {
    const nm = arr(i.names);
    return `<div class="imp-i">${fileInline(i.file)}${nm.length ? `<div class="names">${nm.map(x => `<code>${esc(x)}</code>`).join("")}</div>` : ""}</div>`;
  }).join("") + `</div>` : `<p class="empty">Imports no other file in this repo.</p>`;

  h += `<h2>Libraries</h2>`;
  const libs = arr(f.libs);
  h += libs.length ? `<div class="libs">${libs.map(l => `<code>${esc(l)}</code>`).join("")}</div>` : `<p class="empty">No outside libraries.</p>`;

  h += `<h2>Used by</h2>`;
  const ub = strs(f.used_by);
  h += ub.length ? rowsBlock(ub, 150) : `<p class="empty">No other file imports this one.</p>`;
  return h;
}
function fileInline(p) {
  const f = F(p);
  return `<a href="${fileHref(p)}"><span title="${esc(f ? roleName(f.role) : "")}">${esc(f ? roleEmoji(f.role) : "?")}</span> <span class="mono">${esc(p)}</span></a>` +
    (f && f.purpose ? ` <span class="muted small">${pr(clip(f.purpose, 110))}</span>` : "");
}
function countMissing(items) {
  let c = 0;
  arr(items).forEach(it => { it = obj(it); if (!str(it.note).trim()) c++; arr(it.methods).forEach(m => { if (!str(obj(m).note).trim()) c++; }); c += countMissing(it.children); });
  return c;
}
function lineLink(path, line) {
  if (!line) return "";
  const u = sourceUrl(path, line);
  return `<span class="ln">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="View source at line ${esc(line)}">L${esc(line)}</a>` : "L" + esc(line)}</span>`;
}
function itemHtml(it, path, ids, isChild) {
  it = obj(it);
  const kind = str(it.kind) || "function";
  const kcls = ["class", "function", "method", "table", "type", "const", "value"].includes(kind) ? kind : "other";
  const glyph = {class: "C", function: "ƒ", method: "m", table: "▦", type: "T", const: "=", value: "v"}[kind] || kind.charAt(0).toUpperCase();
  const id = ids[str(it.name)];
  const sig = str(it.signature) && str(it.signature) !== str(it.name) ? `<code class="sig">${esc(it.signature)}</code>` : "";
  let h = `<li class="item" ${id ? `id="${id}"` : ""}><div class="irow"><span class="kind k-${kcls}" title="${esc(kind)}" aria-label="${esc(kind)}">${esc(glyph)}</span><span class="nm">${esc(it.name)}</span>${sig}` +
    (it.exported === false ? `<span class="priv" title="Not part of the public interface">private</span>` : "") + lineLink(path, it.line) + `</div>`;
  h += noteHtml(it.note);
  const calls = arr(it.calls).map(str).filter(Boolean);
  if (calls.length) h += `<div class="calls">calls &rarr; ` + calls.map(c => ids[c] ? `<a data-goto="${ids[c]}" role="link" tabindex="0">${esc(c)}</a>` : `<code>${esc(c)}</code>`).join(" ") + `</div>`;
  const methods = arr(it.methods).map(obj);
  if (methods.length) h += `<ul class="methods">` + methods.map(m =>
    `<li class="item"><div class="irow"><span class="kind k-method" title="method" aria-label="method">m</span><span class="nm">${esc(m.name)}</span>` +
    (str(m.signature) && m.signature !== m.name ? `<code class="sig">${esc(m.signature)}</code>` : "") + lineLink(path, m.line) + `</div>${noteHtml(m.note)}</li>`).join("") + `</ul>`;
  const kids = arr(it.children);
  if (kids.length) h += `<ul>` + kids.map(k => itemHtml(k, path, ids, true)).join("") + `</ul>`;
  return h + `</li>`;
}
function noteHtml(n) {
  n = str(n).trim();
  if (n) return `<div class="note">${pr(n)}</div>`;
  return D.mode === "written" ? `<div class="note none">no note yet</div>` : "";
}

function viewWarnings() {
  const paths = new Set(D.paths);
  let h = `<h1>Warnings</h1>`;
  if (!D.warnings.length) return h + `<p class="empty">No warnings. Everything in the written tour matches the code.</p>`;
  h += `<p class="muted prose">The tour and the code disagree in these places. Fix them in <code>.repotour/</code> and build again.</p><ul class="warnlist">` +
    D.warnings.map(w => `<li>${pr(w).replace(/[^\s'"(),:;]+/g, tok => { const raw = tok.replace(/&amp;/g, "&"); return paths.has(raw) ? `<a href="${fileHref(raw)}">${tok}</a>` : tok; })}</li>`).join("") + `</ul>`;
  return h;
}
function notFound(kind, id) {
  return `<h1>Not found</h1><p>There is no ${esc(kind)} called <code>${esc(id)}</code> in this tour.</p><p><a href="#/">Back to the home page</a></p>`;
}

/* ---------- router ---------- */
function parseHash() {
  let h = location.hash.replace(/^#/, "");
  if (h.charAt(0) !== "/") h = "/" + h;
  let query = "";
  const qi = h.indexOf("?");
  if (qi >= 0) { query = h.slice(qi + 1); h = h.slice(0, qi); }
  // a #p-<id> anchor after a part route
  const ai = h.indexOf("#");
  let anchor = "";
  if (ai >= 0) { anchor = h.slice(ai + 1); h = h.slice(0, ai); }
  const segs = h.split("/").filter((s, i) => i > 0 || s !== "");
  const dec = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
  return {name: dec(segs[0] || ""), arg: segs.slice(1).map(dec).join("/"), query: new URLSearchParams(query), anchor};
}
let lastKey = "";
function render() {
  const r = parseHash();
  const app = $("#main");
  let html, title = D.project.name, nav = "home";
  try {
    switch (r.name) {
      case "part": html = viewPart(r.arg); nav = "parts"; title = (D.partById[r.arg] || {}).name || "Part"; break;
      case "parts": html = viewParts(); nav = "parts"; title = "Parts"; break;
      case "story": html = viewStory(r.arg); nav = "stories"; title = (D.storyById[r.arg] || {}).title || "Story"; break;
      case "stories": html = viewStories(); nav = "stories"; title = "Stories"; break;
      case "file": html = viewFile(r.arg); nav = "files"; title = r.arg.split("/").pop(); break;
      case "files": html = viewFiles(r.query); nav = "files"; title = "All files"; break;
      case "warnings": html = viewWarnings(); nav = ""; title = "Warnings"; break;
      default: html = viewHome();
    }
  } catch (e) {
    console.error(e);
    html = `<h1>Something went wrong</h1><p>This view could not be drawn: <code>${esc(e && e.message)}</code></p>`;
  }
  app.innerHTML = html;
  document.title = (title === D.project.name ? title : title + " · " + D.project.name);
  document.querySelectorAll("nav.main a").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (r.name === "files") updateFilesResults();
  const key = r.name + "/" + r.arg;
  if (r.anchor && $("#" + CSS.escape(r.anchor))) { $("#" + CSS.escape(r.anchor)).scrollIntoView(); }
  else if (key !== lastKey || r.name !== "files") window.scrollTo(0, 0);
  lastKey = key;
  closeDd();
}
window.addEventListener("hashchange", render);

/* ---------- events ---------- */
function flash(id) {
  const el = document.getElementById(id); if (!el) return;
  el.scrollIntoView({block: "center", behavior: "smooth"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1800);
}
function copyText(t, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
}
$("#main").addEventListener("click", e => {
  const t = e.target.closest("[data-goto],[data-copy],[data-more],[data-chip]");
  if (!t) return;
  if (t.dataset.goto) { e.preventDefault(); flash(t.dataset.goto); }
  else if (t.dataset.copy != null) copyText(t.dataset.copy, t);
  else if (t.dataset.more) {
    const m = MORE[t.dataset.more]; if (!m) return;
    const wrap = document.createElement("div"); wrap.innerHTML = m.paths.map(p => fileRow(p, m.opts)).join("");
    const parent = t.parentNode; parent.removeChild(t);
    while (wrap.firstChild) parent.appendChild(wrap.firstChild);
    delete MORE[t.dataset.more];
  } else if (t.dataset.chip) {
    const k = t.dataset.chip, v = t.dataset.val;
    FS[k] = FS[k] === v ? "" : v;
    history.replaceState(null, "", filesQuery());
    document.querySelectorAll('[data-chip="' + k + '"]').forEach(b => b.setAttribute("aria-pressed", String(FS[k] === b.dataset.val)));
    updateFilesResults();
  }
});
$("#main").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.goto) { e.preventDefault(); flash(e.target.dataset.goto); }
});
$("#main").addEventListener("input", e => {
  if (e.target.id !== "fq") return;
  clearTimeout(fqTimer);
  fqTimer = setTimeout(() => { FS.q = e.target.value; history.replaceState(null, "", filesQuery()); updateFilesResults(); }, 120);
});
let fqTimer = 0;
$("#main").addEventListener("toggle", e => {
  const d = e.target;
  if (!d.dataset || !d.dataset.tree || !d.open) return;
  const t = TREE[d.dataset.tree];
  if (t && !t.built) { t.built = true; d.querySelector(".inner").innerHTML = folderBody(d.dataset.tree); }
}, true);

/* global search */
const gs = $("#gsearch"), dd = $("#dd");
let ddItems = [], ddSel = -1, gsTimer = 0;
function closeDd() { dd.hidden = true; ddSel = -1; }
function updateDd() {
  const words = matchWords(gs.value);
  if (!words.length) { closeDd(); return; }
  const hit = s => words.every(w => s.toLowerCase().includes(w));
  let h = "";
  const ps = D.parts.filter(p => hit(p.name + " " + p.role)).slice(0, 3);
  const ss = D.stories.filter(s => hit(s.title + " " + s.summary)).slice(0, 3);
  const fs = buildIndex().filter(e => words.every(w => e.s.includes(w))).slice(0, 8);
  const total = buildIndex().filter(e => words.every(w => e.s.includes(w))).length;
  if (ps.length) h += `<div class="dd-h">Parts</div>` + ps.map(p => `<a class="dd-i" href="${partHref(p.id)}">${esc(p.name)}<span class="muted">${esc(clip(p.role, 50))}</span></a>`).join("");
  if (ss.length) h += `<div class="dd-h">Stories</div>` + ss.map(s => `<a class="dd-i" href="${storyHref(s.id)}">${esc(s.title)}</a>`).join("");
  if (fs.length) h += `<div class="dd-h">Files</div>` + fs.map(e => `<a class="dd-i" href="${fileHref(e.p)}">${esc(roleEmoji(F(e.p).role))} <span class="mono">${esc(e.p)}</span></a>`).join("");
  h += `<a class="dd-i" href="#/files?q=${encodeURIComponent(gs.value.trim())}"><b>See all ${fmt(total)} matching files</b></a>`;
  dd.innerHTML = h; dd.hidden = false;
  ddItems = [...dd.querySelectorAll(".dd-i")]; ddSel = -1;
}
gs.addEventListener("input", () => { clearTimeout(gsTimer); gsTimer = setTimeout(updateDd, 100); });
gs.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (dd.hidden) return;
    e.preventDefault();
    ddSel = (ddSel + (e.key === "ArrowDown" ? 1 : -1) + ddItems.length) % ddItems.length;
    ddItems.forEach((a, i) => a.classList.toggle("sel", i === ddSel));
    ddItems[ddSel].scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (ddSel >= 0 && ddItems[ddSel]) location.hash = ddItems[ddSel].getAttribute("href");
    else if (gs.value.trim()) location.hash = "#/files?q=" + encodeURIComponent(gs.value.trim());
    closeDd();
  }
});
document.addEventListener("click", e => { if (!e.target.closest(".searchbox")) closeDd(); });
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
  if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); gs.focus(); gs.select(); }
  else if (e.key === "Escape") {
    if (gs.value || document.activeElement === gs) { gs.value = ""; closeDd(); gs.blur(); }
    else if (document.activeElement && document.activeElement.id === "fq") { const q = document.activeElement; q.value = ""; FS.q = ""; history.replaceState(null, "", filesQuery()); updateFilesResults(); }
  }
});

/* theme */
const root = document.documentElement;
function setTheme(t, save) {
  root.setAttribute("data-theme", t);
  const b = $("#theme"); b.textContent = t === "dark" ? "☀ Light" : "☾ Dark";
  b.setAttribute("aria-pressed", String(t === "dark"));
  if (save) { try { localStorage.setItem("repotour-theme", t); } catch (e) { /* file:// may block */ } }
}
(function initTheme() {
  let t = null;
  try { t = localStorage.getItem("repotour-theme"); } catch (e) { /* ignore */ }
  if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  setTheme(t, false);
})();
$("#theme").addEventListener("click", () => setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true));

/* chrome */
(function initChrome() {
  $("#brand").textContent = D.project.name;
  if (D.warnings.length) { $("#warnbtn").hidden = false; $("#warncount").textContent = D.warnings.length; $("#warnbtn").setAttribute("aria-label", D.warnings.length + " warnings"); }
  const t = D.tool, when = D.built_at ? " on " + esc(D.built_at) : "";
  const name = /^https?:\/\//i.test(str(t.url)) ? `<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.name)}</a>` : esc(t.name);
  $("#foot").innerHTML = `Built with ${name}${t.version ? " v" + esc(t.version) : ""}${when}.`;
  if (!DATA) $("#main").innerHTML = `<h1>No data</h1><p>This is the empty template. Build a tour with <code>repotour build</code>.</p>`;
})();
if (DATA) render();
</script>
